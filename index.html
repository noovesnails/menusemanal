  const items = todosHoy.filter(({key})=>!dayChecks[key]);
  const sueltosHoy = itemsSueltos[day.date] || [];
  el.innerHTML = toggleHtml +
    `<div class="section-title">Por comprar hoy</div>` +
    (items.length===0
      ? `<div class="empty">${todosHoy.length ? 'Ya tienes todo lo necesario en la nevera 🎉' : 'No hay ingredientes en el menú de hoy'}</div>`
      : `<div class="card">${items.map(({item,key,icono,who})=>{
          const isComprado = !!dayComprado[key];
          return `<div class="ing-row ${isComprado?'checked':''}">
            <input type="checkbox" class="compra-check" data-key="${encodeURIComponent(key)}" ${isComprado?'checked':''}>
            <span style="width:20px;text-align:center">${icono}</span>
            <label>${item}</label>
            <span class="ing-src ${origen(who).cls}">${origen(who).label}</span>
          </div>`;
        }).join('')}</div>`) +
    `<div class="section-title">Otros (de hoy)</div>` +
    `<div class="card">
      ${sueltosHoy.length ? sueltosHoy.map(it=>`
        <div class="ing-row suelto-row ${it.comprado?'checked':''}">
          <input type="checkbox" data-id="${it.id}" ${it.comprado?'checked':''}>
          <label>${escapeHtml(it.nombre)}</label>
          <span class="suelto-del" data-id="${it.id}">✕</span>
        </div>`).join('') : ''}
      <form id="sueltoForm" class="suelto-form">
        <input type="text" id="sueltoInput" placeholder="Añadir artículo (papel higiénico...)" autocomplete="off">
        <button type="submit">Añadir</button>
      </form>
    </div>`;

  wireVistaToggle(el);

  el.querySelectorAll('.compra-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      comprado[day.date] = comprado[day.date] || {};
      comprado[day.date][key] = cb.checked;
      scheduleSave();
      cb.closest('.ing-row').classList.toggle('checked', cb.checked);
    });
  });

  const sueltoForm = document.getElementById('sueltoForm');
  sueltoForm.addEventListener('submit', (e)=>{
    e.preventDefault();
    const input = document.getElementById('sueltoInput');
    const nombre = input.value.trim();
    if(!nombre) return;
    itemsSueltos[day.date] = itemsSueltos[day.date] || [];
    itemsSueltos[day.date].push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), nombre, comprado:false });
    scheduleSave();
    renderCompra();
  });
  el.querySelectorAll('.suelto-row input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const it = sueltosHoy.find(x=>x.id===cb.dataset.id);
      if(it){ it.comprado = cb.checked; scheduleSave(); }
      cb.closest('.ing-row').classList.toggle('checked', cb.checked);
    });
  });
  el.querySelectorAll('.suelto-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      itemsSueltos[day.date] = (itemsSueltos[day.date]||[]).filter(x=>x.id!==btn.dataset.id);
      if(itemsSueltos[day.date].length===0) delete itemsSueltos[day.date];
      scheduleSave();
      renderCompra();
    });
  });
}

function fmtKg(n){
  return n.toLocaleString('es-ES', {minimumFractionDigits:1, maximumFractionDigits:1});
}

let pesoPersonaSeleccionada = Object.keys(PERSONAS)[0];

function pesoChartSvg(id, registrosAsc){
  const w = 320, h = 120, padX = 8, padY = 16;
  const kgs = registrosAsc.map(r=>r.kg);
  const min = Math.min(...kgs), max = Math.max(...kgs);
  const rango = (max - min) || 1;
  const n = registrosAsc.length;
  const x = i => padX + (i/(n-1)) * (w - padX*2);
  const y = kg => padY + (1 - (kg - min)/rango) * (h - padY*2);
  const points = registrosAsc.map((r,i)=>`${x(i)},${y(r.kg)}`).join(' ');
  const dots = registrosAsc.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.kg)}" r="3" class="peso-chart-dot"></circle>`).join('');
  const labelFirst = `<text x="${x(0)}" y="${h-2}" class="peso-chart-label" text-anchor="start">${fmtDate(registrosAsc[0].fecha)}</text>`;
  const labelLast = `<text x="${x(n-1)}" y="${h-2}" class="peso-chart-label" text-anchor="end">${fmtDate(registrosAsc[n-1].fecha)}</text>`;
  return `<svg class="peso-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="--chart-color:var(--${id})">
    <polyline points="${points}" class="peso-chart-line"></polyline>
    ${dots}
    ${labelFirst}${labelLast}
  </svg>`;
}

function renderPeso(){
  const el = document.getElementById('viewPeso');
  const personaOpts = Object.keys(PERSONAS).map(id=>`<option value="${id}" ${id===pesoPersonaSeleccionada?'selected':''}>${PERSONAS[id].nombre}</option>`).join('');
  const bloque = (id) => {
    const registros = (peso[id]||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!registros.length) return '';
    const registrosAsc = registros.slice().reverse();
    const chart = registrosAsc.length >= 2 ? pesoChartSvg(id, registrosAsc) : '';
    const filas = registros.map((r,i)=>{
      const anterior = registros[i+1];
      let diff = '';
      if(anterior){
        const d = r.kg - anterior.kg;
        const signo = d > 0 ? '+' : '';
        diff = ` <span class="peso-diff ${d>0?'up':d<0?'down':''}">(${signo}${fmtKg(d)} kg desde el ${fmtDate(anterior.fecha)})</span>`;
      }
      return `<div class="ing-row">
        <span class="dot ${id}"></span>
        <label>${fmtKg(r.kg)} kg${diff}</label>
        <span class="peso-fecha">${fmtDate(r.fecha)}</span>
        <span class="suelto-del peso-del" data-id="${id}" data-fecha="${r.fecha}">✕</span>
      </div>`;
    }).join('');
    return `<div class="card"><div class="person"><span class="dot ${id}"></span>${PERSONAS[id].nombre}</div>${chart}${filas}</div>`;
  };
  const bloques = Object.keys(PERSONAS).filter(id=>personasVisibles.has(id)).map(bloque).join('');
  const vacio = personasVisibles.size===0
    ? `<div class="empty">Ninguna persona seleccionada arriba 👆</div>`
    : `<div class="empty">Todavía no hay registros de peso para quien tienes seleccionado</div>`;
  el.innerHTML = `<div class="section-title">Progresión de peso</div>` +
    (bloques || vacio) +
    `<div class="section-title">Añadir registro</div>` +
    `<div class="card">
      <form id="pesoForm" class="peso-form">
        <select id="pesoPersona">${personaOpts}</select>
        <input type="date" id="pesoFecha" value="${new Date().toISOString().slice(0,10)}">
        <input type="number" id="pesoKg" step="0.1" min="0" placeholder="kg">
        <button type="submit">Añadir</button>
      </form>
    </div>`;

  document.getElementById('pesoForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = document.getElementById('pesoPersona').value;
    const fecha = document.getElementById('pesoFecha').value;
    const kg = parseFloat(document.getElementById('pesoKg').value);
    if(!fecha || isNaN(kg)) return;
    pesoPersonaSeleccionada = id;
    peso[id] = peso[id] || [];
    peso[id] = peso[id].filter(r=>r.fecha!==fecha);
    peso[id].push({fecha, kg});
    scheduleSave();
    renderPeso();
  });

  el.querySelectorAll('.peso-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      peso[id] = (peso[id]||[]).filter(r=>r.fecha!==btn.dataset.fecha);
      if(peso[id].length===0) delete peso[id];
      scheduleSave();
      renderPeso();
    });
  });
}

function renderYo(){
  const el = document.getElementById('viewYo');
  // Entrar en Yo marca como vistas todas las sugerencias que haya ahora mismo (de cualquiera,
  // incluido uno mismo desde otro móvil) — así deja de sonar el aviso de la cabecera.
  if(sugerencias.length){
    const maxFecha = sugerencias.reduce((max,s)=> s.fecha > max ? s.fecha : max, sugerenciasVistasHasta);
    if(maxFecha !== sugerenciasVistasHasta){
      sugerenciasVistasHasta = maxFecha;
      localStorage.setItem('sugerenciasVistasHasta', sugerenciasVistasHasta);
    }
  }
  actualizarAvisoSugerencias();
  const sugerenciaItemHtml = (s) => `<div class="sugerencia-item">
      <div class="sugerencia-autor"><span class="dot ${s.autor}"></span><b>${PERSONAS[s.autor] ? PERSONAS[s.autor].nombre : s.autor}</b><span class="sugerencia-fecha">${fmtFechaHora(s.fecha)}</span></div>
      <div class="sugerencia-texto">${escapeHtml(s.texto)}</div>
    </div>`;
  const sugerenciasHtml = `<div class="section-title">Sugerencias</div>
    <div class="card sugerencias-card">
      <textarea id="sugerenciaInput" rows="2" placeholder="Escribe aquí tu sugerencia o idea...">${escapeHtml(sugerenciaDraft)}</textarea>
      <button type="button" id="sugerenciaBtn">Enviar sugerencia</button>
      <div class="sugerencias-lista">
        ${sugerencias.length ? sugerencias.slice().reverse().map(sugerenciaItemHtml).join('') : '<div class="empty">Todavía no hay sugerencias. ¡Sé el primero! 💡</div>'}
      </div>
    </div>`;
  const fmtVisita = iso => {
    const [fecha, hora] = iso.split("T");
    return hora ? `${fmtDate(fecha)} a las ${hora}` : fmtDate(fecha);
  };
  const personaCard = (id) => {
    const n = efectivoNutri(id);
    const partes = [];
    if(n.proximaVisita) partes.push(`cita con la nutri el ${fmtVisita(n.proximaVisita)}`);
    if(n.inicioNuevoPlan) partes.push(`nuevo plan desde el ${fmtDate(n.inicioNuevoPlan)}`);
    if(n.finPlanActual) partes.push(`plan actual hasta el ${fmtDate(n.finPlanActual)}`);
    const nota = n.notaPendiente ? (partes.length ? ` — ${n.notaPendiente}` : n.notaPendiente) : '';
    const resumen = (partes.length || nota) ? `${partes.join(' · ')}${nota}` : 'sin fechas registradas';
    const notas = n.notasNutri ? `<div class="notas-nutri">${escapeHtml(n.notasNutri)}</div>` : '';
    return `<div class="card">
      <div class="reminder ${id}">🗓️ <span><b>${PERSONAS[id].nombre}:</b> ${resumen}</span></div>
      ${notas}
      <form class="nutri-edit" data-id="${id}">
        <label>Próxima visita<input type="date" name="proximaVisita"></label>
        <label>Inicio del plan<input type="date" name="inicioNuevoPlan"></label>
        <label>Fin del plan<input type="date" name="finPlanActual"></label>
        <button type="submit">Guardar</button>
      </form>
    </div>`;
  };
  const SWATCHES = {
    cristal: 'linear-gradient(135deg, #ffb199, #a78bfa)',
    claro: 'linear-gradient(135deg, #faf7f2 50%, #a9455d 50%)',
    oscuro: 'linear-gradient(135deg, #1b1815 50%, #e08296 50%)',
    'claro-grande': 'linear-gradient(135deg, #fdfcfa 50%, #b4441f 50%)',
    'oscuro-grande': 'linear-gradient(135deg, #0d0d0d 50%, #ff9d57 50%)',
  };
  const temaOptHtml = (id) => `<button type="button" class="tema-opt${id===temaApp?' on':''}" data-tema-id="${id}">
      <span class="tema-swatch" style="background:${SWATCHES[id]}"></span>
      <span class="tema-texto"><b>${TEMAS[id].nombre}</b><span>${TEMAS[id].detalle}</span></span>
      ${id===temaApp?'<span class="tema-check">✓</span>':''}
    </button>`;

  const acentoOptHtml = (temaId, acentoId) => {
    const activo = temaId === temaApp && acentoId === acentoApp;
    const fondo = acentoId === '0' ? `var(--accent)` : ACENTO_SWATCH[acentoId];
    return `<button type="button" class="acento-opt${activo?' on':''}" data-tema-id="${temaId}" data-acento-id="${acentoId}" title="${ACENTOS[acentoId]}">
      <span class="acento-swatch" style="background:${fondo}"></span>
      <span class="acento-nombre">${ACENTOS[acentoId]}</span>
    </button>`;
  };
  // Cada tema lleva su propio desplegable de colores justo debajo de su botón (antes había uno solo
  // compartido para el tema activo, y costaba encontrarlo).
  const temaBloqueHtml = (id) => {
    const abierto = coloresAbiertos.has(id);
    return `<div class="tema-bloque">
      ${temaOptHtml(id)}
      <button type="button" class="opciones-toggle" data-tema-colores="${id}" aria-expanded="${abierto}">
        <span class="meal-label">${id==='cristal' ? 'Degradados de Cristal' : `Color de acento (${TEMAS[id].nombre})`}</span>
        <span class="opciones-chevron" style="${abierto?'transform:rotate(180deg)':''}">⌄</span>
      </button>
      <div class="opciones-collapse${abierto?' abierto':''}">
        <div class="opciones-collapse-inner">
          <div class="acento-picker">${Object.keys(ACENTOS).map(a=>acentoOptHtml(id,a)).join('')}</div>
        </div>
      </div>
    </div>`;
  };

  // Botón de aviso por WhatsApp (issue aviso-whatsapp): solo Pedro lo ve y lo usa, es su número el
  // que manda el mensaje. No hay forma de rellenar el texto en un grupo ya creado (eso solo existe
  // para chats 1 a 1), así que se copia el mensaje y se abre el grupo: falta pegar y enviar.
  if(avisoMensajeDraft === null) avisoMensajeDraft = mensajeAvisoAlAzar(avisoNovedadTexto);
  const avisoHtml = miUsuario === 'pedro' ? `
    <div class="section-title">Avisar a la familia</div>
    <div class="card aviso-whatsapp">
      <label class="aviso-label">Enlace de invitación al grupo
        <input type="url" id="grupoWhatsappInput" placeholder="https://chat.whatsapp.com/..." value="${escapeHtml(grupoWhatsappLink)}">
      </label>
      <label class="aviso-label">¿Qué ha cambiado? (resumen cortito)
        <input type="text" id="avisoNovedadInput" value="${escapeHtml(avisoNovedadTexto)}">
      </label>
      <div class="aviso-label-row">
        <span class="aviso-label">Mensaje</span>
        <button type="button" id="avisoBarajar" class="aviso-barajar" title="Probar otro mensaje">🎲 Otro mensaje</button>
      </div>
      <textarea id="avisoMensaje" rows="3">${escapeHtml(avisoMensajeDraft)}</textarea>
      <button type="button" id="avisoBtn">📋 Copiar mensaje y abrir el grupo</button>
      <div class="aviso-ayuda">Se copia el mensaje y se abre el grupo de WhatsApp — solo falta pegar y pulsar enviar. Cada vez que le des a "Otro mensaje" sale uno distinto de la colección 🎉</div>
    </div>` : '';

  const visibles = Object.keys(PERSONAS).filter(id=>personasVisibles.has(id));
  el.innerHTML = `<div class="section-title">Quién ves</div>` +
    `<div class="personpicker" id="personPicker"></div>` +
    sugerenciasHtml +
    `<div class="section-title">Tema visual</div>` +
    `<div class="tema-picker">${Object.keys(TEMAS).map(temaBloqueHtml).join('')}</div>` +
    avisoHtml +
    `<div class="section-title">Fechas de la nutricionista</div>` +
    (visibles.length ? visibles.map(personaCard).join('') : `<div class="empty">Ninguna persona seleccionada arriba 👆</div>`) +
    `<div class="app-version">Menú semanal · ${APP_VERSION}</div>` +
    `<div class="section-title">Qué ha cambiado</div>` +
    `<div class="changelog">${CHANGELOG.map(c=>`<div class="changelog-item"><b>${fmtDate(c.fecha)}</b> ${escapeHtml(c.texto)}</div>`).join('')}</div>`;

  renderPersonPicker();

  const sugerenciaInput = document.getElementById('sugerenciaInput');
  if(sugerenciaInput) sugerenciaInput.addEventListener('input', ()=>{
    sugerenciaDraft = sugerenciaInput.value; // para no perderlo si llega un refresco de fondo mientras se escribe
  });
  const sugerenciaBtn = document.getElementById('sugerenciaBtn');
  if(sugerenciaBtn) sugerenciaBtn.addEventListener('click', ()=>{
    const texto = (sugerenciaInput.value || '').trim();
    if(!texto) return;
    sugerencias.push({ id: Date.now() + '_' + Math.random().toString(36).slice(2,8), autor: miUsuario, texto, fecha: new Date().toISOString() });
    scheduleSave();
    sugerenciaDraft = '';
    renderYo();
  });

  const grupoInput = document.getElementById('grupoWhatsappInput');
  if(grupoInput) grupoInput.addEventListener('change', ()=>{
    grupoWhatsappLink = grupoInput.value.trim();
    scheduleSave();
  });
  const avisoNovedadInput = document.getElementById('avisoNovedadInput');
  if(avisoNovedadInput) avisoNovedadInput.addEventListener('change', ()=>{
    avisoNovedadTexto = avisoNovedadInput.value;
  });
  const avisoMensajeEl = document.getElementById('avisoMensaje');
  if(avisoMensajeEl) avisoMensajeEl.addEventListener('input', ()=>{
    avisoMensajeDraft = avisoMensajeEl.value; // para no perder lo que Pedro esté escribiendo si algo más dispara un re-render de Yo
  });
  const avisoBarajar = document.getElementById('avisoBarajar');
  if(avisoBarajar) avisoBarajar.addEventListener('click', ()=>{
    avisoMensajeDraft = mensajeAvisoAlAzar(avisoNovedadInput.value || avisoNovedadTexto);
    renderYo();
  });
  const avisoBtn = document.getElementById('avisoBtn');
  if(avisoBtn) avisoBtn.addEventListener('click', async ()=>{
    const link = (document.getElementById('grupoWhatsappInput').value || '').trim();
    if(!link){ alert('Pon primero el enlace de invitación al grupo de WhatsApp.'); return; }
    const mensaje = document.getElementById('avisoMensaje').value;
    const copiado = await copiarAlPortapapeles(mensaje);
    avisoBtn.textContent = copiado ? '✅ Copiado — abriendo WhatsApp…' : '⚠️ No se pudo copiar, cópialo a mano';
    window.open(link, '_blank');
    setTimeout(()=>{ if(document.body.contains(avisoBtn)) avisoBtn.textContent = '📋 Copiar mensaje y abrir el grupo'; }, 2500);
  });

  el.querySelectorAll('.tema-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      aplicarTema(btn.dataset.temaId);
      renderYo();
    });
  });
  el.querySelectorAll('[data-tema-colores]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.temaColores;
      if(coloresAbiertos.has(id)) coloresAbiertos.delete(id); else coloresAbiertos.add(id);
      renderYo();
    });
  });
  el.querySelectorAll('.acento-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      aplicarTema(btn.dataset.temaId);
      aplicarAcento(btn.dataset.acentoId);
      renderYo();
    });
  });

  el.querySelectorAll('.nutri-edit').forEach(form=>{
    const n = efectivoNutri(form.dataset.id);
    form.proximaVisita.value = (n.proximaVisita||'').slice(0,10);
    form.inicioNuevoPlan.value = n.inicioNuevoPlan || '';
    form.finPlanActual.value = n.finPlanActual || '';
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const id = form.dataset.id;
      // El input es <input type="date">: solo puede mostrar/editar la fecha, nunca la hora. Si la
      // fecha no ha cambiado respecto a la ya guardada, se conserva el valor completo original
      // (con hora, si la tenía) en vez del truncado del formulario — si no, cada envío del
      // formulario (aunque solo se tocara otro campo) borraba silenciosamente la hora de la cita.
      const fechaOriginal = (efectivoNutri(id).proximaVisita || '').slice(0,10);
      const fechaForm = form.proximaVisita.value || null;
      const proximaVisita = fechaForm
        ? (fechaForm === fechaOriginal ? efectivoNutri(id).proximaVisita : fechaForm)
        : null;
      const inicioNuevoPlan = form.inicioNuevoPlan.value || null;
      const finPlanActual = form.finPlanActual.value || null;
      const edit = {};
      if(proximaVisita) edit.proximaVisita = proximaVisita;
      if(inicioNuevoPlan) edit.inicioNuevoPlan = inicioNuevoPlan;
      if(finPlanActual) edit.finPlanActual = finPlanActual;
      if(Object.keys(edit).length) nutriEdits[id] = edit; else delete nutriEdits[id];
      scheduleSave();
      renderYo();
    });
  });
}

/* Reconstruir las 5 pestañas enteras en cada cambio de datos (incluido el refresco silencioso
   cada 30s) es trabajo de CPU desperdiciado: solo una pestaña está visible a la vez, y las otras
   cuatro se tiran sin pintarse. Ahora render() solo reconstruye la pestaña activa al momento; las
   demás se marcan "pendientes" y se repintan en el instante en que el usuario cambia a ellas, así
   que nunca se ve contenido desactualizado, solo se evita el trabajo que nadie iba a ver. */
const RENDERERS_POR_TAB = { menu: ()=> vistaMenu==='calendario' ? renderCalendario() : renderMenu(), nevera: renderNevera, compra: renderCompra, peso: renderPeso, yo: renderYo };
let tabsPendientes = new Set(Object.keys(RENDERERS_POR_TAB));

function render(){
  extenderMenusSegunPlan();
  renderDayPicker();
  Object.keys(RENDERERS_POR_TAB).forEach(tab=>{
    if(tab === currentTab){
      RENDERERS_POR_TAB[tab]();
      tabsPendientes.delete(tab);
    } else {
      tabsPendientes.add(tab);
    }
  });
  actualizarVisibilidadMenu();
  if(miUsuario && PERSONAS[miUsuario]){
    document.getElementById('miUsuarioLabel').innerHTML = `Hola, <b>${PERSONAS[miUsuario].nombre}</b>`;
  } else if(modoNevera){
    document.getElementById('miUsuarioLabel').innerHTML = `🧊 <b>Tablet de la cocina</b> · menú de toda la familia`;
  }
  actualizarAvisoSugerencias();
}

document.getElementById('avisoSugerenciasBanner').addEventListener('click', ()=>{
  document.querySelector('nav .tab[data-tab="yo"]').click();
});

document.getElementById('refreshBtn').addEventListener('click', async ()=>{
  await flushPendingSave();
  // el acceso directo de iPhone (Añadir a pantalla de inicio) cachea la página de forma muy
  // agresiva y no comprueba si hay una versión nueva; cambiar la URL con un parámetro nuevo
  // obliga al navegador a pedirla de la red en vez de servir la copia cacheada.
  location.href = location.pathname + '?v=' + Date.now();
});

/* Si el móvil se queda sin conexión justo tras un cambio, o se cambia de pestaña antes de que
   pasen los 700ms del debounce, esto evita perder ese cambio; y al volver a la app se repasa
   JSONBin por si el otro móvil ha actualizado algo mientras tanto. */
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ flushPendingSave(); return; }
  checkAppVersion();
  autoPullIfIdle();
});
window.addEventListener('pagehide', flushPendingSave);
setInterval(()=>{
  if(document.visibilityState !== 'visible') return;
  checkAppVersion();
  autoPullIfIdle();
}, 30000);
setTimeout(checkAppVersion, 3000);

document.querySelectorAll('nav .tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentTab = btn.dataset.tab;
    document.querySelectorAll('nav .tab').forEach(b=>b.classList.toggle('active', b===btn));
    actualizarVisibilidadMenu();
    document.getElementById('viewNevera').style.display = currentTab==='nevera' ? '' : 'none';
    document.getElementById('viewCompra').style.display = currentTab==='compra' ? '' : 'none';
    document.getElementById('viewPeso').style.display = currentTab==='peso' ? '' : 'none';
    document.getElementById('viewYo').style.display = currentTab==='yo' ? '' : 'none';
    if(tabsPendientes.has(currentTab)){
      RENDERERS_POR_TAB[currentTab]();
      tabsPendientes.delete(currentTab);
    }
  });
});

/* Primer arranque sin identidad guardada: si la pantalla es ancha y baja (tablet apaisada de
   verdad, no un móvil grande en horizontal), se asume que es un dispositivo compartido — la
   tablet de la nevera — y se entra directo mostrando a toda la familia, sin pedir "¿quién eres?".
   Cualquier móvil (incluso en horizontal) tiene menos de 650px de alto y sigue yendo al
   onboarding normal. */
if(!miUsuario && !modoNevera && window.matchMedia('(min-width:1000px) and (min-height:650px)').matches){
  modoNevera = true;
  localStorage.setItem('modoNevera', '1');
}
if(!miUsuario && !modoNevera){ mostrarOnboarding(); } else { loadRemote(); }
</script>
