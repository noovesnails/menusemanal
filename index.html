<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Semanal</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2420; --muted:#8a7f74;
    --accent:#a9455d; --accent-soft:#f3dde2; --line:#ece4dc;
    --pedro:#6d8a6b; --pedro-soft:#e7efe6; --nuria:#c07a3f; --nuria-soft:#f6e6d5;
    --rocio:#5b7ea6; --rocio-soft:#e4ecf5;
    --paqui:#9c6bb0; --paqui-soft:#ede3f2; --sole:#b0506b; --sole-soft:#f4e0e5;
    --eva:#3f8f8a; --eva-soft:#dfeeed;
    --ok:#5a8c5a;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1815; --card:#252220; --ink:#f1ece6; --muted:#a89e93;
      --accent:#e08296; --accent-soft:#3a2429; --line:#3a3430;
      --pedro:#8fb28d; --pedro-soft:#26302a; --nuria:#e0a869; --nuria-soft:#332821;
      --rocio:#8ba9cf; --rocio-soft:#232a33;
      --paqui:#c49bd8; --paqui-soft:#332a38; --sole:#dc8a9d; --sole-soft:#38262a;
      --eva:#6fc4be; --eva-soft:#213533;
      --ok:#7cb87c;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1815; --card:#252220; --ink:#f1ece6; --muted:#a89e93;
    --accent:#e08296; --accent-soft:#3a2429; --line:#3a3430;
    --pedro:#8fb28d; --pedro-soft:#26302a; --nuria:#e0a869; --nuria-soft:#332821;
    --rocio:#8ba9cf; --rocio-soft:#232a33;
    --paqui:#c49bd8; --paqui-soft:#332a38; --sole:#dc8a9d; --sole-soft:#38262a;
    --eva:#6fc4be; --eva-soft:#213533;
    --ok:#7cb87c;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;}
  h1{font-size:1.1rem;margin:0;padding:14px 16px 4px;letter-spacing:.2px;}
  .sub{padding:0 16px 10px;color:var(--muted);font-size:.8rem;}

  .daypicker{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;-webkit-overflow-scrolling:touch;}
  .daychip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:58px;cursor:pointer;}
  .daychip .dname{font-size:.7rem;color:var(--muted);text-transform:uppercase;}
  .daychip .dnum{font-size:1.05rem;font-weight:600;}
  .daychip.active{background:var(--pedro);border-color:var(--pedro);}
  .daychip.active .dname,.daychip.active .dnum{color:#fff;}

  main{padding:0 16px 8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;}
  .person{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:.95rem;}
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.pedro{background:var(--pedro);} .dot.nuria{background:var(--nuria);} .dot.rocio{background:var(--rocio);}
  .dot.paqui{background:var(--paqui);} .dot.sole{background:var(--sole);} .dot.eva{background:var(--eva);}
  .meal{margin-bottom:10px;}
  .meal:last-child{margin-bottom:0;}
  .meal-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px;}
  .meal-body{display:flex;align-items:center;gap:10px;}
  .meal-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;}
  .meal-title{font-size:.92rem;line-height:1.35;}
  .opciones-block{margin-top:14px;}
  .opciones-cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .opcion-card{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;line-height:1.3;cursor:pointer;background:var(--bg);}
  .opcion-card.elegida{border-color:var(--accent);background:var(--accent-soft);}
  .recipe{margin-top:6px;}
  .recipe-btn{font-size:.75rem;font-weight:600;color:var(--accent);cursor:pointer;list-style:none;display:inline-block;padding:3px 0;}
  .recipe-btn::-webkit-details-marker{display:none;}
  .recipe-btn::before{content:"📖 ";}
  .recipe-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .recipe-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .recipe-servings{font-size:.78rem;color:var(--muted);}
  .recipe-mode{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}
  .recipe-mode.thermomix{background:var(--line);color:var(--ink);}
  .recipe-mode.manual{background:var(--line);color:var(--muted);}
  .recipe-subtitle{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px;}
  .recipe-ing,.recipe-steps{margin:0;padding-left:1.15rem;font-size:.85rem;line-height:1.5;}
  .recipe-ing li,.recipe-steps li{margin-bottom:3px;}

  .section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 4px 8px;}
  .recipe-toggle{display:flex;align-items:center;gap:10px;margin:0 4px 14px;font-size:.85rem;color:var(--muted);}
  .toggle-switch{position:relative;display:flex;width:180px;height:34px;border-radius:17px;background:var(--line);border:none;padding:2px;cursor:pointer;}
  .toggle-opt{flex:1;z-index:1;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--muted);}
  .toggle-switch.manual .toggle-opt:last-child,.toggle-switch.thermomix .toggle-opt:first-child{color:var(--ink);}
  .toggle-thumb{position:absolute;top:2px;left:2px;width:calc(50% - 2px);height:calc(100% - 4px);border-radius:15px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s ease;}
  .toggle-switch.manual .toggle-thumb{transform:translateX(100%);}
  .ing-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .ing-row:last-child{border-bottom:none;}
  .ing-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;}
  .ing-row label{font-size:.9rem;flex:1;}
  .ing-row.checked label{color:var(--muted);text-decoration:line-through;}
  .suelto-del{font-size:.8rem;color:var(--muted);cursor:pointer;flex:0 0 auto;padding:2px 4px;}
  .suelto-form{display:flex;gap:8px;padding:4px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:4px;}
  .suelto-form input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;background:var(--bg);color:var(--ink);}
  .suelto-form button{border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;}
  .peso-diff{font-size:.75rem;color:var(--muted);}
  .peso-diff.up{color:var(--accent);}
  .peso-diff.down{color:var(--ok);}
  .peso-fecha{font-size:.72rem;color:var(--muted);flex:0 0 auto;}
  .peso-form{display:flex;gap:8px;flex-wrap:wrap;}
  .peso-form select,.peso-form input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;background:var(--bg);color:var(--ink);}
  .peso-form input[type=number]{width:80px;}
  .peso-form button{border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;}
  .peso-chart{width:100%;height:100px;margin-bottom:6px;overflow:visible;}
  .peso-chart-line{fill:none;stroke:var(--chart-color, var(--accent));stroke-width:2;}
  .peso-chart-dot{fill:var(--chart-color, var(--accent));}
  .peso-chart-label{font-size:7px;fill:var(--muted);}
  .ing-src{font-size:.65rem;padding:2px 6px;border-radius:6px;flex:0 0 auto;}
  .ing-src.pedro{background:var(--pedro-soft);color:var(--pedro);}
  .ing-src.nuria{background:var(--nuria-soft);color:var(--nuria);}
  .ing-src.rocio{background:var(--rocio-soft);color:var(--rocio);}
  .ing-src.paqui{background:var(--paqui-soft);color:var(--paqui);}
  .ing-src.sole{background:var(--sole-soft);color:var(--sole);}
  .ing-src.eva{background:var(--eva-soft);color:var(--eva);}
  .ing-src.multi{background:var(--accent-soft);color:var(--accent);}

  .empty{color:var(--muted);font-size:.85rem;padding:20px 4px;text-align:center;}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);}
  nav button{flex:1;background:none;border:none;color:var(--muted);font-size:.68rem;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ic{font-size:1.15rem;}
  nav button.active{color:var(--accent);font-weight:700;}

  .syncbar{display:flex;align-items:center;gap:6px;padding:0 16px 4px;font-size:.72rem;color:var(--muted);}
  .syncdot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .syncdot.ok{background:var(--ok);}
  .syncdot.err{background:var(--accent);}
  .refresh-btn{margin-left:auto;background:none;border:none;color:var(--muted);font-size:.72rem;padding:2px 4px;cursor:pointer;display:flex;align-items:center;gap:3px;}
  .reminders{padding:0 16px 10px;display:flex;flex-direction:column;gap:6px;}
  .reminders-footer{padding-top:14px;margin-top:6px;border-top:1px solid var(--line);}
  .reminder{border-radius:12px;padding:8px 12px;font-size:.78rem;display:flex;align-items:center;gap:8px;}
  .reminder.pedro{background:var(--pedro-soft);color:var(--pedro);}
  .reminder.nuria{background:var(--nuria-soft);color:var(--nuria);}
  .reminder.rocio{background:var(--rocio-soft);color:var(--rocio);}
  .reminder.paqui{background:var(--paqui-soft);color:var(--paqui);}
  .reminder.sole{background:var(--sole-soft);color:var(--sole);}
  .reminder.eva{background:var(--eva-soft);color:var(--eva);}
  .reminder b{font-weight:700;}
  .personpicker{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px;}
  .personchip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.75rem;font-weight:600;cursor:pointer;background:var(--card);color:var(--muted);}
  .personchip.on.pedro{background:var(--pedro);border-color:var(--pedro);color:#fff;}
  .personchip.on.nuria{background:var(--nuria);border-color:var(--nuria);color:#fff;}
  .personchip.on.rocio{background:var(--rocio);border-color:var(--rocio);color:#fff;}
  .personchip.on.paqui{background:var(--paqui);border-color:var(--paqui);color:#fff;}
  .personchip.on.sole{background:var(--sole);border-color:var(--sole);color:#fff;}
  .personchip.on.eva{background:var(--eva);border-color:var(--eva);color:#fff;}
</style>

<h1>Menú semanal</h1>
<div class="sub" id="weekSub"></div>
<div class="syncbar"><span class="syncdot" id="syncDot"></span><span id="syncText">Cargando…</span><button class="refresh-btn" id="refreshBtn">🔄 Actualizar</button></div>

<div class="personpicker" id="personPicker"></div>

<div class="daypicker" id="dayPicker"></div>

<main id="viewMenu"></main>
<main id="viewNevera" style="display:none"></main>
<main id="viewCompra" style="display:none"></main>
<main id="viewPeso" style="display:none"></main>

<div class="reminders reminders-footer" id="reminders"></div>

<nav>
  <button class="tab active" data-tab="menu"><span class="ic">🍽️</span>Menú</button>
  <button class="tab" data-tab="nevera"><span class="ic">🧊</span>Nevera</button>
  <button class="tab" data-tab="compra"><span class="ic">🛒</span>Compra</button>

</nav>

<script>
/* ---------- DATOS DE LA SEMANA ----------
   Semana del lunes 7 al domingo 13 de septiembre de 2026.
   Fuente: PDFs de la nutricionista (Pedro 24-07-2026, Nuria 15-06-2026).
   Para cargar una nueva semana: sustituir este array WEEK por la siguiente semana. */
const WEEK_START = "2026-09-07"; // lunes

/* Nombre legible y color de cada persona. Añadir aquí una entrada al incorporar a alguien nuevo
   (y su par --id/--id-soft en las variables CSS de :root). */
const PERSONAS = {
  pedro:{ nombre:"Pedro" },
  nuria:{ nombre:"Nuria" },
  rocio:{ nombre:"Rocío" },
  paqui:{ nombre:"Paqui" },
  sole:{ nombre:"Sole" },
  eva:{ nombre:"Eva" }

   cada visita a la nutricionista. Cualquier campo a null no se muestra en el recordatorio. */

  paqui:{ proximaVisita:"2026-10-06", inicioNuevoPlan:null, finPlanActual:"2026-10-11", notaPendiente:null },
  sole:{ proximaVisita:"2026-10-06", inicioNuevoPlan:null, finPlanActual:"2026-10-11", notaPendiente:null },
  eva:{ proximaVisita:null, inicioNuevoPlan:null, finPlanActual:null, notaPendiente:"falta menú, pendiente de subir" }

   vez lo que le apetece. Solo se listan las categorías con contenido real en el plan de la
   nutricionista — si a alguien le falta una categoría, no se inventa. */

  pedro:{
    desayuno:[
      "Café o té (sin azúcar ni edulcorantes) + leche sin lactosa + yogur griego sin lactosa (200g) + canela/cacao puro al gusto + pera madura o manzana asada + 15-20g whey",

          "Termina con perejil picado y un chorrito de aceite de oliva virgen extra."
        ]}}},
      cena:{title:"Tortilla jugosa con puré de boniato",
        ing:["3 huevos","300 g boniato","1 c/s aceite de oliva"]}
    },
    nuria:{
      comida:{title:"Dorada con espinacas y calabacín a la plancha",
        ing:["dorada","espinacas","calabacín"]},
      cena:{title:"Solomillos de pollo o pavo (140g) + tomate, canónigos y espárragos/palmitos",
        ing:["140 g solomillos de pollo o pavo","tomate","canónigos","espárragos blancos o palmitos"]}
    }
  },

  { name:"Jueves", date:"2026-09-10",

const JSONBIN_ID = "6a301b19f5f4af5e29f5ec66";
const JSONBIN_KEY = "$2a$10$vFbnhWMCDqkb4eHXuuPjyOmhB88kcnaQjTnU/zfXL53RdRIcQpx56";
const JSONBIN_BASE = "https://api.jsonbin.io/v3/b/" + JSONBIN_ID;

let remoteRecord = {};   // contenido completo del bin (no tocar claves ajenas)
let checks = {};         // { "2026-09-07": { "400 g morcillo": true, ... } }
let itemsSueltos = {};   // { "2026-09-07": [{id, nombre, comprado}] } artículos sueltos por día de compra
let peso = {};           // { pedro: [{fecha, kg}], ... } histórico de peso por persona
let saveTimer = null;

function setSync(state, text){
  const dot = document.getElementById('syncDot');
  dot.className = 'syncdot' + (state ? ' '+state : '');
  document.getElementById('syncText').textContent = text;
}

/* Migra el formato antiguo de itemsSueltos (lista única global, sin fecha) al nuevo formato por
   día: los artículos ya guardados se asignan al día de hoy, la única fecha que tiene sentido
   suponer sin inventar una. */
function migrarItemsSueltos(raw){
  if(Array.isArray(raw)) return raw.length ? { [todayISOReal()]: raw } : {};
  return raw || {};
}
function todayISOReal(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}

async function loadRemote(){
  try{
    setSync('', 'Cargando…');
    const res = await fetch(JSONBIN_BASE + "/latest", { headers: { "X-Master-Key": JSONBIN_KEY } });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    remoteRecord = data.record || {};
    checks = (remoteRecord.menuSemanal && remoteRecord.menuSemanal.checks) || {};
    itemsSueltos = migrarItemsSueltos(remoteRecord.menuSemanal && remoteRecord.menuSemanal.itemsSueltos);
    peso = (remoteRecord.menuSemanal && remoteRecord.menuSemanal.peso) || {};
    setSync('ok', 'Sincronizado');
  }catch(e){
    console.warn("No se pudo cargar JSONBin, usando almacenamiento local", e);
    try{ checks = JSON.parse(localStorage.getItem('menuSemanalChecks')||'{}'); }catch(_){ checks = {}; }
    try{ itemsSueltos = migrarItemsSueltos(JSON.parse(localStorage.getItem('menuSemanalItemsSueltos')||'{}')); }catch(_){ itemsSueltos = {}; }
    try{ peso = JSON.parse(localStorage.getItem('menuSemanalPeso')||'{}'); }catch(_){ peso = {}; }
    setSync('err', 'Sin conexión (guardado local)');
  }
  render();
}

function scheduleSave(){
  localStorage.setItem('menuSemanalChecks', JSON.stringify(checks));
  localStorage.setItem('menuSemanalItemsSueltos', JSON.stringify(itemsSueltos));
  localStorage.setItem('menuSemanalPeso', JSON.stringify(peso));
  clearTimeout(saveTimer);
  setSync('', 'Guardando…');
  saveTimer = setTimeout(saveRemote, 700);
}

async function saveRemote(){
  try{
    remoteRecord.menuSemanal = remoteRecord.menuSemanal || {};
    remoteRecord.menuSemanal.checks = checks;
    remoteRecord.menuSemanal.itemsSueltos = itemsSueltos;
    remoteRecord.menuSemanal.peso = peso;
    remoteRecord.menuSemanal.updatedAt = new Date().toISOString();
    const res = await fetch(JSONBIN_BASE, {
      method: "PUT",
      headers: { "Content-Type":"application/json", "X-Master-Key": JSONBIN_KEY },
      body: JSON.stringify(remoteRecord)
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    setSync('ok', 'Sincronizado');
  }catch(e){
    console.warn("No se pudo guardar en JSONBin", e);
    setSync('err', 'Guardado solo en local');
  }
}

function fmtDate(iso){

/* Único punto de entrada de texto libre escrito por el usuario (itemsSueltos); todo lo demás en
   la app viene de constantes propias, no necesita escaparse. */
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fmtMesAnio(iso){
  const d = new Date(iso+"T00:00:00");
  return "de " + MESES[d.getMonth()] + " " + d.getFullYear();
}

/* combina ingredientes de comida+cena de ambos, marcando la(s) fuente(s) */
/* separa un ingrediente en {nombre, cantidad}: "140 g de pollo" -> {nombre:"pollo", cantidad:"140 g"};
   "pollo" (sin cantidad reconocida) -> {nombre:"pollo", cantidad:null}. El nombre es la clave de
   fusión: dos apariciones con el mismo nombre son el mismo ingrediente aunque una lleve cantidad. */
function normalizarIngrediente(item){
  const m = item.match(/^((?:\d+(?:[.,]\d+)?(?:-\d+(?:[.,]\d+)?)?|½|¼|⅓|⅔|¾)(?:\s*(?:g|kg|ml|l|c\/s|c\/c|ud\.?|unidades?)\b)?)\s*(?:de\s+)?(.+)$/i);
  if(!m) return {nombre:item.trim(), cantidad:null};
  return {nombre:m[2].trim(), cantidad:m[1].trim()};
}

const ICONOS_INGREDIENTE = [
  [/pollo|pavo|carrillada|morcillo|jamón|ternera|hígado|caña/i, "🍗"],
  [/pescado|bacalao|salmón|atún|merluza|rape|lenguado|dorada|corvina|caballa|gallineta|mejillon|almeja|gamba|sepia/i, "🐟"],
  [/huevo/i, "🥚"],
  [/queso|yogur|leche|kéfir/i, "🧀"],
  [/arroz|pasta|quinoa|pan\b/i, "🌾"],
  [/aceite|vinagre|sal\b|perejil|especias|ajo/i, "🫒"],
  [/zanahoria|puerro|calabaz|brócoli|espinaca|tomate|pimiento|cebolla|patata|boniato|champiñ|aceituna|calabacín|calabacin|verdura/i, "🥕"],
  [/almendra|nuez|nueces|semilla|frutos secos/i, "🥜"],
  [/manzana|pera|plátano|fruta|kiwi|naranja/i, "🍎"]
];
function iconoIngrediente(nombre){
  const hit = ICONOS_INGREDIENTE.find(([re]) => re.test(nombre));
  return hit ? hit[1] : "🛒";
}

function fridgeItems(day){
  const map = new Map(); // nombre normalizado -> {cantidades:Set, who:Set}
  Object.keys(PERSONAS).filter(id=>day[id] && personasVisibles.has(id)).forEach(who=>{
    const person = day[who];
    ["comida","cena"].forEach(meal=>{
      person[meal].ing.forEach(item=>{
        const {nombre, cantidad} = normalizarIngrediente(item);
        if(!map.has(nombre)) map.set(nombre, {cantidades:new Set(), who:new Set()});
        const entry = map.get(nombre);
        if(cantidad) entry.cantidades.add(cantidad);
        entry.who.add(who);
      });
    });
  });
  return Array.from(map.entries())
    .map(([nombre, {cantidades, who}])=>{
      const cant = cantidades.size ? ` (${Array.from(cantidades).join(" + ")})` : "";
      const label = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      return { item: label + cant, key: nombre, icono: iconoIngrediente(nombre), who: Array.from(who) };
    })
    .sort((a,b)=>a.item.localeCompare(b.item, "es"));
}

/* etiqueta + clase CSS del origen de un ingrediente a partir de la lista de personas que lo necesitan */
function origen(whoArr){
  if(whoArr.length===1) return {cls:whoArr[0], label:PERSONAS[whoArr[0]].nombre};
  return {cls:"multi", label: whoArr.map(id=>PERSONAS[id].nombre).join(" · ")};
}

    itemsSueltos[day.date] = itemsSueltos[day.date] || [];
    itemsSueltos[day.date].push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), nombre, comprado:false });
    scheduleSave();
    renderCompra();
  });
  el.querySelectorAll('.suelto-row input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const it = sueltosHoy.find(x=>x.id===cb.dataset.id);
      if(it){ it.comprado = cb.checked; scheduleSave(); }
      cb.closest('.ing-row').classList.toggle('checked', cb.checked);
    });
  });
  el.querySelectorAll('.suelto-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      itemsSueltos[day.date] = (itemsSueltos[day.date]||[]).filter(x=>x.id!==btn.dataset.id);
      if(itemsSueltos[day.date].length===0) delete itemsSueltos[day.date];
      scheduleSave();
      renderCompra();
    });
  });
}

function fmtKg(n){
  return n.toLocaleString('es-ES', {minimumFractionDigits:1, maximumFractionDigits:1});
}

let pesoPersonaSeleccionada = Object.keys(PERSONAS)[0];

function pesoChartSvg(id, registrosAsc){
  const w = 320, h = 120, padX = 8, padY = 16;
  const kgs = registrosAsc.map(r=>r.kg);
  const min = Math.min(...kgs), max = Math.max(...kgs);
  const rango = (max - min) || 1;
  const n = registrosAsc.length;
  const x = i => padX + (i/(n-1)) * (w - padX*2);
  const y = kg => padY + (1 - (kg - min)/rango) * (h - padY*2);
  const points = registrosAsc.map((r,i)=>`${x(i)},${y(r.kg)}`).join(' ');
  const dots = registrosAsc.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.kg)}" r="3" class="peso-chart-dot"></circle>`).join('');
  const labelFirst = `<text x="${x(0)}" y="${h-2}" class="peso-chart-label" text-anchor="start">${fmtDate(registrosAsc[0].fecha)}</text>`;
  const labelLast = `<text x="${x(n-1)}" y="${h-2}" class="peso-chart-label" text-anchor="end">${fmtDate(registrosAsc[n-1].fecha)}</text>`;
  return `<svg class="peso-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="--chart-color:var(--${id})">
    <polyline points="${points}" class="peso-chart-line"></polyline>
    ${dots}
    ${labelFirst}${labelLast}
  </svg>`;
}

function renderPeso(){
  const el = document.getElementById('viewPeso');
  const personaOpts = Object.keys(PERSONAS).map(id=>`<option value="${id}" ${id===pesoPersonaSeleccionada?'selected':''}>${PERSONAS[id].nombre}</option>`).join('');
  const bloque = (id) => {
    const registros = (peso[id]||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!registros.length) return '';
    const registrosAsc = registros.slice().reverse();
    const chart = registrosAsc.length >= 2 ? pesoChartSvg(id, registrosAsc) : '';
    const filas = registros.map((r,i)=>{
      const anterior = registros[i+1];
      let diff = '';
      if(anterior){
        const d = r.kg - anterior.kg;
        const signo = d > 0 ? '+' : '';
        diff = ` <span class="peso-diff ${d>0?'up':d<0?'down':''}">(${signo}${fmtKg(d)} kg desde el ${fmtDate(anterior.fecha)})</span>`;
      }
      return `<div class="ing-row">
        <span class="dot ${id}"></span>
        <label>${fmtKg(r.kg)} kg${diff}</label>
        <span class="peso-fecha">${fmtDate(r.fecha)}</span>
        <span class="suelto-del peso-del" data-id="${id}" data-fecha="${r.fecha}">✕</span>
      </div>`;
    }).join('');
    return `<div class="card"><div class="person"><span class="dot ${id}"></span>${PERSONAS[id].nombre}</div>${chart}${filas}</div>`;
  };
  const bloques = Object.keys(PERSONAS).filter(id=>personasVisibles.has(id)).map(bloque).join('');
  const vacio = personasVisibles.size===0
    ? `<div class="empty">Ninguna persona seleccionada arriba 👆</div>`
    : `<div class="empty">Todavía no hay registros de peso para quien tienes seleccionado</div>`;
  el.innerHTML = `<div class="section-title">Progresión de peso</div>` +
    (bloques || vacio) +
    `<div class="section-title">Añadir registro</div>` +
    `<div class="card">
      <form id="pesoForm" class="peso-form">
        <select id="pesoPersona">${personaOpts}</select>
        <input type="date" id="pesoFecha" value="${new Date().toISOString().slice(0,10)}">
        <input type="number" id="pesoKg" step="0.1" min="0" placeholder="kg">
        <button type="submit">Añadir</button>
      </form>
    </div>`;

  document.getElementById('pesoForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const id = document.getElementById('pesoPersona').value;
    const fecha = document.getElementById('pesoFecha').value;
    const kg = parseFloat(document.getElementById('pesoKg').value);
    if(!fecha || isNaN(kg)) return;
    pesoPersonaSeleccionada = id;
    peso[id] = peso[id] || [];
    peso[id] = peso[id].filter(r=>r.fecha!==fecha);
    peso[id].push({fecha, kg});
    scheduleSave();
    renderPeso();
  });

  el.querySelectorAll('.peso-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      peso[id] = (peso[id]||[]).filter(r=>r.fecha!==btn.dataset.fecha);
      if(peso[id].length===0) delete peso[id];
      scheduleSave();
      renderPeso();
    });
  });
}

function renderReminders(){
  const el = document.getElementById('reminders');
  const fmtVisita = iso => {
    const [fecha, hora] = iso.split("T");
    return hora ? `${fmtDate(fecha)} a las ${hora}` : fmtDate(fecha);
  };
  const line = (who,n) => {
    const partes = [];
    if(n.proximaVisita) partes.push(`cita con la nutri el ${fmtVisita(n.proximaVisita)}`);
    if(n.inicioNuevoPlan) partes.push(`nuevo plan desde el ${fmtDate(n.inicioNuevoPlan)}`);
    if(n.finPlanActual) partes.push(`plan actual hasta el ${fmtDate(n.finPlanActual)}`);
    if(!partes.length && !n.notaPendiente) return '';
    const nota = n.notaPendiente ? (partes.length ? ` — ${n.notaPendiente}` : n.notaPendiente) : '';
    return `<div class="reminder ${who}">🗓️ <span><b>${PERSONAS[who].nombre}:</b> ${partes.join(' · ')}${nota}</span></div>`;
  };
  el.innerHTML = Object.keys(PERSONAS).filter(id=>NUTRI[id]).map(id=>line(id,NUTRI[id])).join('');
}

function render(){
  renderDayPicker();
  renderReminders();
  renderPersonPicker();
  renderMenu();
  renderNevera();
  renderCompra();
  renderPeso();
}

document.getElementById('refreshBtn').addEventListener('click', ()=>{
  // el acceso directo de iPhone (Añadir a pantalla de inicio) cachea la página de forma muy
  // agresiva y no comprueba si hay una versión nueva; cambiar la URL con un parámetro nuevo
  // obliga al navegador a pedirla de la red en vez de servir la copia cacheada.
  location.href = location.pathname + '?v=' + Date.now();
});

    document.getElementById('viewCompra').style.display = currentTab==='compra' ? '' : 'none';
    document.getElementById('viewPeso').style.display = currentTab==='peso' ? '' : 'none';
  });
});
