<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Semanal</title>
<style>
  /* Sistema de 5 temas elegibles desde Yo (issue de cambio de look + accesibilidad), aplicados vía
     [data-tema] en <html> y guardados solo en localStorage (preferencia de dispositivo, como
     modoReceta — cada móvil puede llevar el suyo, no se sincroniza por JSONBin). "cristal" es el
     tema por defecto (sin atributo = sin esperar a que cargue JS, cero parpadeo). Los dos temas
     "grande" suben el font-size base del <html>: como casi todo el CSS usa rem, el texto entero
     crece de forma proporcional sin tocar una sola regla de componente. Colores en OKLCH, igual que
     ya se hacía: aclarar/oscurecer un tono es solo tocar el canal L. */
  :root{
    --bg:radial-gradient(120% 90% at 15% 0%, oklch(86% 0.09 60) 0%, oklch(78% 0.13 20) 22%, oklch(72% 0.14 0) 42%, oklch(68% 0.13 310) 68%, oklch(72% 0.1 255) 100%);
    --card:oklch(100% 0 0 / 55%); --ink:oklch(22% 0.03 300); --muted:oklch(42% 0.025 300 / 85%);
    --accent:oklch(52% 0.19 300); --accent-soft:oklch(68% 0.14 300 / 20%); --line:oklch(100% 0 0 / 45%);
    --pedro:oklch(60.2% 0.0568 143.2); --pedro-soft:oklch(94.4% 0.0147 142.2 / 70%); --nuria:oklch(64.2% 0.1149 58.7); --nuria-soft:oklch(93.3% 0.0286 69.2 / 70%);
    --rocio:oklch(58.3% 0.0736 252.4); --rocio-soft:oklch(94% 0.0149 251.2 / 70%);
    --paqui:oklch(60.5% 0.1149 315.7); --paqui-soft:oklch(92.8% 0.0227 314.7 / 70%); --sole:oklch(56% 0.1278 4.4); --sole-soft:oklch(92.4% 0.0229 0.6 / 70%);
    --eva:oklch(59.9% 0.0784 189.7); --eva-soft:oklch(93.8% 0.016 192.1 / 70%);
    --marta:oklch(61.5% 0.0958 75.4); --marta-soft:oklch(92.9% 0.0284 79.5 / 70%);
    --ok:oklch(59.1% 0.0923 144.3);
    --shadow-1:0 1px 0 oklch(100% 0 0 / 65%) inset,0 10px 22px oklch(32% 0.08 300 / 16%);
    --shadow-2:0 1px 0 oklch(100% 0 0 / 75%) inset,0 14px 28px oklch(32% 0.08 300 / 22%);
    --shadow-3:0 1px 0 oklch(100% 0 0 / 85%) inset,0 20px 40px oklch(32% 0.08 300 / 30%);
  }
  /* "cristal" repite el bloque de :root — así el tema explícito y el que se ve antes de que cargue
     el JS (atributo aún sin poner) son exactamente el mismo, sin parpadeo al aplicar el atributo. */
  :root[data-tema="cristal"]{
    --bg:radial-gradient(120% 90% at 15% 0%, oklch(86% 0.09 60) 0%, oklch(78% 0.13 20) 22%, oklch(72% 0.14 0) 42%, oklch(68% 0.13 310) 68%, oklch(72% 0.1 255) 100%);
    --card:oklch(100% 0 0 / 55%); --ink:oklch(22% 0.03 300); --muted:oklch(42% 0.025 300 / 85%);
    --accent:oklch(52% 0.19 300); --accent-soft:oklch(68% 0.14 300 / 20%); --line:oklch(100% 0 0 / 45%);
    --pedro:oklch(60.2% 0.0568 143.2); --pedro-soft:oklch(94.4% 0.0147 142.2 / 70%); --nuria:oklch(64.2% 0.1149 58.7); --nuria-soft:oklch(93.3% 0.0286 69.2 / 70%);
    --rocio:oklch(58.3% 0.0736 252.4); --rocio-soft:oklch(94% 0.0149 251.2 / 70%);
    --paqui:oklch(60.5% 0.1149 315.7); --paqui-soft:oklch(92.8% 0.0227 314.7 / 70%); --sole:oklch(56% 0.1278 4.4); --sole-soft:oklch(92.4% 0.0229 0.6 / 70%);
    --eva:oklch(59.9% 0.0784 189.7); --eva-soft:oklch(93.8% 0.016 192.1 / 70%);
    --marta:oklch(61.5% 0.0958 75.4); --marta-soft:oklch(92.9% 0.0284 79.5 / 70%);
    --ok:oklch(59.1% 0.0923 144.3);
    --shadow-1:0 1px 0 oklch(100% 0 0 / 65%) inset,0 10px 22px oklch(32% 0.08 300 / 16%);
    --shadow-2:0 1px 0 oklch(100% 0 0 / 75%) inset,0 14px 28px oklch(32% 0.08 300 / 22%);
    --shadow-3:0 1px 0 oklch(100% 0 0 / 85%) inset,0 20px 40px oklch(32% 0.08 300 / 30%);
  }
  /* Blur limitado a 2 superficies grandes (tarjetas y la barra de navegación) y nunca en chips o
     botones sueltos: es la diferencia entre un efecto cristal vistoso y uno que castiga la GPU de
     una tablet Android de gama baja (ver informe de rendimiento — cada superficie con blur cuesta,
     no es gratis, así que se dosifica en vez de prohibirse). */
  [data-tema="cristal"] .card,[data-tema="cristal"] nav{backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);}

    --accent:oklch(53% 0.1329 7.9); --accent-soft:oklch(91.7% 0.0251 2.1); --line:oklch(92.3% 0.0139 67.7);
    --pedro:oklch(60.2% 0.0568 143.2); --pedro-soft:oklch(94.4% 0.0147 142.2); --nuria:oklch(64.2% 0.1149 58.7); --nuria-soft:oklch(93.3% 0.0286 69.2);
    --rocio:oklch(58.3% 0.0736 252.4); --rocio-soft:oklch(94% 0.0149 251.2);
    --paqui:oklch(60.5% 0.1149 315.7); --paqui-soft:oklch(92.8% 0.0227 314.7); --sole:oklch(56% 0.1278 4.4); --sole-soft:oklch(92.4% 0.0229 0.6);
    --eva:oklch(59.9% 0.0784 189.7); --eva-soft:oklch(93.8% 0.016 192.1);
    --marta:oklch(61.5% 0.0958 75.4); --marta-soft:oklch(92.9% 0.0284 79.5);
    --ok:oklch(59.1% 0.0923 144.3);
    --shadow-1:0 1px 2px oklch(27% 0.013 52 / 7%),0 2px 6px oklch(27% 0.013 52 / 5%);
    --shadow-2:0 2px 4px oklch(27% 0.013 52 / 9%),0 6px 16px oklch(27% 0.013 52 / 9%);
    --shadow-3:0 4px 10px oklch(27% 0.013 52 / 14%),0 14px 32px oklch(27% 0.013 52 / 18%);
  }
  :root[data-tema="oscuro"]{
    --bg:oklch(21.1% 0.0075 67.4); --card:oklch(25.5% 0.0059 56.1); --ink:oklch(94.5% 0.0097 72.7); --muted:oklch(70.5% 0.0196 70.1);
    --accent:oklch(71.3% 0.1173 6.8); --accent-soft:oklch(29% 0.0344 4.6); --line:oklch(33% 0.011 56);
    --pedro:oklch(72.7% 0.065 143.5); --pedro-soft:oklch(29.8% 0.0174 158.8); --nuria:oklch(77.1% 0.1038 68.5); --nuria-soft:oklch(28.7% 0.0207 54.2);
    --rocio:oklch(72.6% 0.0648 254.5); --rocio-soft:oklch(28.2% 0.0194 254.8);
    --paqui:oklch(74.8% 0.0965 314.4); --paqui-soft:oklch(30.1% 0.0277 313.4); --sole:oklch(72.3% 0.1023 4.9); --sole-soft:oklch(29.2% 0.0279 4.3);
    --eva:oklch(76.5% 0.0834 189.7); --eva-soft:oklch(31.1% 0.026 188);
    --marta:oklch(75.8% 0.0958 75.4); --marta-soft:oklch(30% 0.0278 75.7);
    --ok:oklch(72.6% 0.1057 144.4);

    --shadow-2:0 2px 4px oklch(0% 0 0 / 24%),0 6px 16px oklch(0% 0 0 / 22%);
    --shadow-3:0 4px 10px oklch(0% 0 0 / 32%),0 14px 32px oklch(0% 0 0 / 40%);
  }

     vía el font-size del html más abajo. */
  :root[data-tema="claro-grande"]{

    --shadow-2:0 1px 0 oklch(100% 0 0 / 5%) inset,0 9px 22px oklch(0% 0 0 / 46%);

  :root[data-tema="claro-grande"],:root[data-tema="oscuro-grande"]{ font-size:20px; }

  /* Arreglo de contraste de base: en oscuro/oscuro-grande, --accent es claro a propósito (para leerse
     como texto sobre fondo oscuro), pero eso lo hace ilegible como fondo sólido con texto blanco
     encima (botones). --accent-btn cubre ese segundo uso con un valor más oscuro del mismo tono; en
     los temas claros no hace falta redefinirlo, ya vale --accent tal cual (ver fallback en los
     botones). */
  :root[data-tema="oscuro"]{ --accent-btn:oklch(45% 0.170 6.8); }
  :root[data-tema="oscuro-grande"]{ --accent-btn:oklch(45% 0.133 40); }

  /* 10 degradados adicionales dentro de Cristal (selector de colores) — mismo arco de color que el
     degradado por defecto, solo rotado para centrarse en cada acento. Todos los --accent/--accent-btn
     de aquí en adelante se calcularon verificando el contraste real (WCAG) contra blanco y contra los
     fondos de cada tema, y manteniéndose dentro del gamut sRGB — nunca dependen de que el navegador
     recorte un color fuera de gama. */
  [data-tema="cristal"][data-acento="rosa"]{
    --bg:radial-gradient(120% 90% at 15% 0%, oklch(86% 0.09 128) 0%, oklch(78% 0.13 88) 22%, oklch(72% 0.14 68) 42%, oklch(68% 0.13 18) 68%, oklch(72% 0.1 323) 100%);

  }
  [data-tema="cristal"][data-acento="coral"]{

    --accent:oklch(48% 0.183 25); --accent-soft:oklch(92% 0.045 25 / 25%); --accent-btn:oklch(45% 0.172 25);

  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:76px;}

  /* Micro-interacciones baratas (solo transform/opacity, nada de blur ni sombras animadas en bucle)
     para que tocar algo se sienta con respuesta, incluso en hardware limitado. */
  button,.opcion-card,.daychip,.onboarding-opt,.personchip,.media-add-btn,.compra-semana-dia,.receta-opt{
    transition:transform .1s ease,box-shadow .15s ease,background-color .15s ease,border-color .15s ease;
  }
  button:active,.opcion-card:active,.daychip:active,.onboarding-opt:active,.personchip:active,.media-add-btn:active,.compra-semana-dia:active{
    transform:scale(.96);
  }
  .ing-row input[type=checkbox]{transition:transform .1s ease;}
  .ing-row input[type=checkbox]:active{transform:scale(1.15);}
  .ing-row label{transition:color .15s ease;}
  nav button .ic{display:inline-block;transition:transform .15s ease;}
  nav button.active .ic{transform:scale(1.15);}
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.001ms !important;}
  }
  h1{font-size:1.1rem;margin:0;padding:14px 16px 4px;letter-spacing:.2px;}
  .sub{padding:0 16px 10px;color:var(--muted);font-size:.8rem;}

  .daypicker{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 14px;-webkit-overflow-scrolling:touch;}
  .daychip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;min-width:58px;cursor:pointer;}
  .daychip .dname{font-size:.7rem;color:var(--muted);text-transform:uppercase;}
  .daychip .dnum{font-size:1.05rem;font-weight:600;}
  .daychip.active{background:var(--pedro);border-color:var(--pedro);box-shadow:var(--shadow-2);}
  .daychip.active .dname,.daychip.active .dnum{color:#fff;}

  main{padding:0 16px 8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow-1);}
  .person{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:.95rem;}
  .dot{width:10px;height:10px;border-radius:50%;}
  .dot.pedro{background:var(--pedro);} .dot.nuria{background:var(--nuria);} .dot.rocio{background:var(--rocio);}
  .dot.paqui{background:var(--paqui);} .dot.sole{background:var(--sole);} .dot.eva{background:var(--eva);} .dot.marta{background:var(--marta);}
  .meal{margin-bottom:10px;}
  .meal:last-child{margin-bottom:0;}
  .meal-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px;}
  .meal-body{display:flex;align-items:center;gap:10px;}
  .meal-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:0 0 auto;}
  .meal-title{font-size:1rem;line-height:1.35;}
  .meal-media{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;flex:0 0 auto;}
  .meal-media img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
  .meal-thumb{cursor:pointer;}
  .media-add-btn{width:52px;height:52px;border-radius:10px;border:1.5px dashed var(--line);background:var(--bg);color:var(--muted);font-size:1.1rem;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .media-add-btn:hover{border-color:var(--accent);color:var(--accent);}
  .media-edit-btn,.media-del-btn{position:absolute;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:.6rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
  .media-edit-btn{top:2px;right:2px;}
  .media-del-btn{bottom:2px;right:2px;}
  .video-badge{position:absolute;left:2px;bottom:2px;width:18px;height:18px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:.55rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 0 0 2px;}
  .opciones-block{margin-top:14px;}
  .opciones-toggle{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;padding:4px 0;margin:0;text-align:left;cursor:pointer;color:inherit;font:inherit;}
  .opciones-toggle .meal-label{margin-bottom:0;flex:0 0 auto;}
  .opciones-preview{flex:1;min-width:0;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .opciones-chevron{flex:0 0 auto;color:var(--muted);font-size:.9rem;transition:transform .2s ease;}
  .opciones-toggle[aria-expanded="true"] .opciones-chevron{transform:rotate(180deg);}
  /* Truco de grid para animar de alto 0 a "lo que ocupe el contenido" sin tener que medirlo con JS
     (display:none no se puede animar, y max-height a mano obliga a un valor fijo arbitrario). */
  .opciones-collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease;}
  .opciones-collapse.abierto{grid-template-rows:1fr;}
  .opciones-collapse-inner{overflow:hidden;min-height:0;}
  .opciones-cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
  .opcion-card{position:relative;flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.82rem;line-height:1.3;cursor:pointer;background:var(--bg);}
  .opcion-card:not(.con-media){padding-right:72px;}
  .opcion-card.elegida{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-2);}
  .opcion-card.con-media{display:flex;flex-direction:column;padding:0;overflow:hidden;}
  .opcion-media-img{position:relative;width:100%;aspect-ratio:4/5;background-size:cover;background-position:center;background-color:var(--line);flex:0 0 auto;cursor:pointer;}
  .opcion-texto{padding:8px 10px;font-weight:600;}
  .opcion-media-add{position:absolute;top:6px;right:6px;display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;border:none;background:rgba(0,0,0,.08);color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .opcion-card .media-edit-btn,.opcion-card .media-del-btn{top:6px;width:22px;height:22px;font-size:.7rem;}
  .opcion-card .media-edit-btn{right:6px;}
  .opcion-card .media-del-btn{right:32px;}
  .opcion-card .video-badge{left:6px;bottom:6px;width:22px;height:22px;font-size:.65rem;}
  .video-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;}
  .video-modal video,.video-modal img{max-width:92vw;max-height:80vh;border-radius:10px;box-shadow:var(--shadow-3);}
  .video-modal-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:1.2rem;cursor:pointer;}
  .recipe{margin-top:6px;}
  .recipe-btn{font-size:.75rem;font-weight:600;color:var(--accent);cursor:pointer;list-style:none;display:inline-block;padding:3px 0;}
  .recipe-btn::-webkit-details-marker{display:none;}
  .recipe-btn::before{content:"📖 ";}
  .recipe-body{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);}
  .recipe-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .recipe-servings{font-size:.78rem;color:var(--muted);}
  .recipe-mode{font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;background:var(--line);color:var(--ink);}
  .recipe-subtitle{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px;}
  .recipe-ing,.recipe-steps{margin:0;padding-left:1.15rem;font-size:1rem;line-height:1.5;}
  .recipe-ing li,.recipe-steps li{margin-bottom:3px;}

  .section-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 4px 8px;}
  .recipe-toggle{display:flex;align-items:center;gap:10px;margin:0 4px 14px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;}
  .receta-toggle{display:flex;border-radius:17px;background:var(--line);padding:2px;gap:2px;}
  .receta-opt{flex:1;border:none;background:none;border-radius:15px;padding:8px 10px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .receta-opt.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow-1);}
  .compra-semana-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .compra-semana-dia{display:flex;align-items:center;gap:6px;font-size:.78rem;padding:6px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;}
  .compra-semana-dia input{width:16px;height:16px;accent-color:var(--accent);}
  .compra-semana-info{font-size:.75rem;color:var(--muted);margin-top:10px;}
  .compra-semana-resumen{display:flex;flex-wrap:wrap;gap:6px;margin:0 4px 10px;}
  .compra-semana-chip{font-size:.72rem;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:20px;font-weight:600;}
  .compra-semana-rango{display:flex;gap:14px;flex-wrap:wrap;}
  .compra-semana-rango label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);flex:1 1 140px;}
  .compra-semana-rango input{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;background:var(--bg);color:var(--ink);}
  .compra-semana-editar{margin:0 4px 14px;}
  .compra-semana-editar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;font-size:.78rem;cursor:pointer;}
  .ing-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .ing-row:last-child{border-bottom:none;}
  .ing-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto;}
  .ing-row label{font-size:.9rem;flex:1;}
  .ing-row.checked label{color:var(--muted);text-decoration:line-through;}
  .suelto-del{font-size:.8rem;color:var(--muted);cursor:pointer;flex:0 0 auto;padding:2px 4px;}
  .suelto-form{display:flex;gap:8px;padding:12px 4px 4px;border-top:1px solid var(--line);margin-top:4px;}
  .suelto-form input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;background:var(--bg);color:var(--ink);}
  .suelto-form button{border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;background:var(--accent-btn, var(--accent));color:#fff;cursor:pointer;}
  .peso-diff{font-size:.75rem;color:var(--muted);}
  .peso-diff.up{color:var(--accent);}
  .peso-diff.down{color:var(--ok);}
  .peso-fecha{font-size:.72rem;color:var(--muted);flex:0 0 auto;}
  .peso-form{display:flex;gap:8px;flex-wrap:wrap;}
  .peso-form select,.peso-form input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;background:var(--bg);color:var(--ink);}
  .peso-form input[type=number]{width:80px;}
  .peso-form button{border:none;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;background:var(--accent-btn, var(--accent));color:#fff;cursor:pointer;}
  .peso-chart{width:100%;height:100px;margin-bottom:6px;overflow:visible;}
  .peso-chart-line{fill:none;stroke:var(--chart-color, var(--accent));stroke-width:2;}
  .peso-chart-dot{fill:var(--chart-color, var(--accent));}
  .peso-chart-label{font-size:7px;fill:var(--muted);}
  .ing-src{font-size:.65rem;padding:2px 6px;border-radius:6px;flex:0 0 auto;}
  .ing-src.pedro{background:var(--pedro-soft);color:var(--pedro);}
  .ing-src.nuria{background:var(--nuria-soft);color:var(--nuria);}
  .ing-src.rocio{background:var(--rocio-soft);color:var(--rocio);}
  .ing-src.paqui{background:var(--paqui-soft);color:var(--paqui);}
  .ing-src.sole{background:var(--sole-soft);color:var(--sole);}
  .ing-src.eva{background:var(--eva-soft);color:var(--eva);}
  .ing-src.marta{background:var(--marta-soft);color:var(--marta);}
  .ing-src.multi{background:var(--accent-soft);color:var(--accent);}

  .empty{color:var(--muted);font-size:.85rem;padding:20px 4px;text-align:center;}

  nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);}
  nav button{flex:1;background:none;border:none;color:var(--muted);font-size:.68rem;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  nav button .ic{font-size:1.15rem;}
  nav button.active{color:var(--accent);font-weight:700;}

  .syncbar{display:flex;align-items:center;gap:6px;padding:0 16px 4px;font-size:.72rem;color:var(--muted);}
  .syncdot{width:7px;height:7px;border-radius:50%;background:var(--muted);}
  .syncdot.ok{background:var(--ok);}
  .syncdot.err{background:var(--accent);}
  .refresh-btn{margin-left:auto;background:none;border:none;color:var(--muted);font-size:.72rem;padding:2px 8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:3px;transition:background-color .2s,color .2s;}
  .refresh-btn.pending{background:var(--accent-btn, var(--accent));color:#fff;}
  .refresh-btn.done{background:var(--ok);color:#fff;}
  .reminders{padding:0 0 10px;display:flex;flex-direction:column;gap:6px;}
  .reminder{border-radius:12px;padding:8px 12px;font-size:.78rem;display:flex;align-items:center;gap:8px;}
  .reminder.pedro{background:var(--pedro-soft);color:var(--pedro);}
  .reminder.nuria{background:var(--nuria-soft);color:var(--nuria);}
  .reminder.rocio{background:var(--rocio-soft);color:var(--rocio);}
  .reminder.paqui{background:var(--paqui-soft);color:var(--paqui);}
  .reminder.sole{background:var(--sole-soft);color:var(--sole);}
  .reminder.eva{background:var(--eva-soft);color:var(--eva);}
  .reminder.marta{background:var(--marta-soft);color:var(--marta);}
  .reminder b{font-weight:700;}
  .mi-usuario{padding:0 16px 6px;font-size:.78rem;color:var(--muted);}
  .mi-usuario b{color:var(--ink);}
  .aviso-sugerencias{display:flex;align-items:center;gap:6px;margin:0 16px 10px;padding:9px 12px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);font-size:.78rem;font-weight:700;cursor:pointer;}
  .nutri-edit{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .nutri-edit label{font-size:.68rem;color:var(--muted);display:flex;flex-direction:column;gap:2px;}
  .nutri-edit input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.82rem;background:var(--bg);color:var(--ink);}
  .nutri-edit button{border:none;border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:600;background:var(--accent-btn, var(--accent));color:#fff;cursor:pointer;align-self:flex-end;}

  .aviso-whatsapp{display:flex;flex-direction:column;gap:10px;}
  .aviso-label{font-size:.72rem;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px;}
  .aviso-label input,.aviso-whatsapp textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;}
  .aviso-whatsapp > button{border:none;border-radius:8px;padding:10px 14px;font-size:.85rem;font-weight:700;background:var(--accent-btn, var(--accent));color:#fff;cursor:pointer;}
  .aviso-ayuda{font-size:.72rem;color:var(--muted);}
  .aviso-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-4px;}
  .aviso-barajar{border:1px dashed var(--line);border-radius:20px;padding:4px 10px;font-size:.7rem;font-weight:600;background:none;color:var(--accent);cursor:pointer;}
  .sugerencias-card{display:flex;flex-direction:column;gap:10px;}
  .sugerencias-card textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:.85rem;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;}
  .sugerencias-card > button{border:none;border-radius:8px;padding:10px 14px;font-size:.85rem;font-weight:700;background:var(--accent-btn, var(--accent));color:#fff;cursor:pointer;align-self:flex-start;}
  .sugerencias-lista{display:flex;flex-direction:column;gap:10px;}
  .sugerencia-item{border-top:1px solid var(--line);padding-top:10px;}
  .sugerencia-item:first-child{border-top:none;padding-top:0;}
  .sugerencia-autor{display:flex;align-items:center;gap:6px;font-size:.78rem;margin-bottom:3px;}
  .sugerencia-fecha{color:var(--muted);font-weight:400;margin-left:auto;font-size:.7rem;}
  .sugerencia-texto{font-size:.85rem;line-height:1.35;}
  .notas-nutri{margin-top:8px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:.8rem;line-height:1.4;color:var(--ink);white-space:pre-wrap;}
  .app-version{text-align:center;font-size:.68rem;color:var(--muted);opacity:.6;padding:24px 0 8px;}
  .changelog{display:flex;flex-direction:column;gap:6px;padding:0 16px 24px;font-size:.78rem;color:var(--muted);}
  .changelog-item b{color:var(--ink);margin-right:4px;}
  .onboarding{position:fixed;inset:0;background:var(--bg);z-index:100;padding:24px 20px;overflow-y:auto;}
  .onboarding h2{font-size:1.05rem;margin:0 0 6px;}

     que arranca, al ser una pantalla ancha y baja, el navegador aplica este bloque desde el primer
     pintado. El umbral (min-width 1000px Y min-height 650px, los dos a la vez) deja fuera a los
     móviles grandes en horizontal (que son anchos pero bajos, <500px de alto) y solo entra con una
     pantalla realmente de tablet u ordenador. La identidad de "quién eres" (modoNevera) es un JS
     aparte, ver más abajo — este bloque es puramente visual. */
  @media (min-width: 1000px) and (min-height: 650px){
    body{padding-bottom:0; padding-left:104px;}

    nav{position:fixed; top:0; bottom:0; left:0; right:auto; width:104px; height:100%;

    #viewMenu{display:grid; grid-template-columns:repeat(auto-fit, minmax(360px,1fr)); gap:18px; align-items:start;}

    #viewNevera,#viewCompra,#viewPeso,#viewYo{max-width:760px; margin-left:auto; margin-right:auto;}
  }

  { name:"Martes", date:"2026-09-29",
    nuria:{
      comida:{title:"Pollo al wok (140g) + calabacín, champiñones, zanahoria (salsa de soja)",
        ing:["140 g pollo","calabacín","champiñones","zanahoria","salsa de soja"],
        recipe:{servings:"1 ración",thermomix:{steps:["Pon la zanahoria en el vaso: 3 seg/vel 4. Coloca la mariposa, añade el aceite y el pollo en tiras, dora: 5 min/120°/vel 1.","Añade el calabacín y los champiñones: 5 min/120°/vel 1.","Incorpora un chorrito de salsa de soja y mezcla: 1 min/100°/vel 1."]},tradicional:{ing:["140 g pollo","calabacín","champiñones","zanahoria","salsa de soja"],steps:["Corta el pollo en tiras y saltéalo en un wok o sartén amplia con un chorrito de aceite a fuego fuerte 3-4 min hasta que se dore; retira y reserva.","En el mismo wok saltea la zanahoria en juliana 2 min, añade el calabacín y los champiñones y saltea 4-5 min más.","Vuelve a añadir el pollo, incorpora un chorrito de salsa de soja y saltea 1-2 min más mezclando bien."]}}},
      cena:{title:"Gallineta (140g) con pisto suave (calabacín, berenjena y tomate bien cocinados)",
        ing:["140 g gallineta","calabacín","berenjena","tomate","1 c/s aceite de oliva"],
        recipe:{servings:"1 ración",thermomix:{steps:["Pon el calabacín y la berenjena en el vaso: 3 seg/vel 4. Coloca la mariposa, añade el aceite y sofríe: 8 min/120°/vel 1.","Añade el tomate troceado: 10 min/100°/vel 1, sin cubilete.","Cocina la gallineta a la plancha aparte, 3-4 min por cada lado.","Sirve sobre el pisto."]},tradicional:{ing:["140 g gallineta","calabacín","berenjena","tomate","1 c/s aceite de oliva"],steps:["Corta el calabacín y la berenjena en dados y sofríelos en una sartén con el aceite 8-10 min.","Añade el tomate troceado y cocina 10 min más a fuego suave hasta que quede meloso; salpimienta.","Sazona la gallineta y cocínala a la plancha 3-4 min por cada lado.","Sirve sobre el pisto."]}}}

        recipe:{servings:"1 ración",thermomix:{steps:["Pon la zanahoria en el vaso: 4 seg/vel 5. Añade el aceite y el pollo en dados, dora: 5 min/120°/giro a la izquierda/vel cuchara.","Añade el calabacín y el arroz, rehoga: 1 min/100°/giro a la izquierda/vel cuchara.","Vierte el doble de volumen de agua que de arroz: 16 min/100°/giro a la izquierda/vel cuchara, sin cubilete."]},tradicional:{ing:["60 g arroz","150 g pollo","zanahoria","calabacín","aceite de oliva"],steps:["Corta el pollo en dados y dóralo en una cazuela con el aceite 3-4 min.","Añade la zanahoria y el calabacín troceados y rehoga 5 min.","Incorpora el arroz, remueve un minuto para que se impregne, y añade el doble de volumen de agua o caldo que de arroz.","Sazona, tapa y cocina a fuego medio-bajo 16-18 min hasta que el arroz esté en su punto y haya absorbido el líquido."]}}},
      cena:{title:"Boquerones rebozados (180g) con pisto casero",

        recipe:{servings:"1 ración",thermomix:{steps:["Pon el calabacín y la berenjena en el vaso: 3 seg/vel 4. Coloca la mariposa, añade el aceite y sofríe: 8 min/120°/vel 1.","Añade el tomate triturado: 10 min/100°/vel 1, sin cubilete.","Mientras, pasa los boquerones por harina y fríelos en una sartén aparte con aceite bien caliente, 1-2 min por lado.","Sirve los boquerones con el pisto."]},tradicional:{ing:["180 g boquerones","harina para rebozar","pisto casero"],steps:["Prepara el pisto: sofríe el calabacín y la berenjena troceados en una sartén con aceite 8-10 min, añade tomate triturado y cocina 10 min más hasta que quede meloso; sazona.","Limpia los boquerones, pásalos por harina sacudiendo el exceso, y fríelos en aceite bien caliente 1-2 min por cada lado hasta que estén dorados; escurre sobre papel absorbente.","Sirve los boquerones con el pisto."]}}}

    marta:{

        ing:["180 g tofu","brócoli","calabacín","tomatitos cherry","1 c/s aceite de oliva"],

/* Subida de fotos/vídeos vía Cloudinary (unsigned upload preset — pensado para subir desde el
   cliente sin exponer una clave secreta; el preset solo permite subir, no gestionar la cuenta). */
const CLOUDINARY_CLOUD = "dtjgzeezk";
const CLOUDINARY_PRESET = "menusemanal";

/* Inserta una transformación de Cloudinary (formato/calidad automáticos + ancho) en una URL de
   entrega, para no servir nunca la foto/vídeo original (varios MB, resolución de cámara) cuando
   solo se muestra en una miniatura o tarjeta pequeña. Las transformaciones van SIEMPRE justo
   después de "/upload/", antes de la versión (v1234567890) y del public_id — insertarla más
   adelante (p. ej. justo antes del nombre de archivo) hace que Cloudinary la interprete como parte
   del public_id y la imagen deje de resolverse (404), que es justo el bug de la primera versión de
   esta función. */
function cloudinaryOptim(url, width){
  if(!url) return url;
  const marker = '/upload/';
  const i = url.indexOf(marker);
  if(i === -1) return url;
  const insertAt = i + marker.length;
  return url.slice(0, insertAt) + `f_auto,q_auto,w_${width}/` + url.slice(insertAt);
}

function normalizarClave(texto){
  return texto.trim().toLowerCase();
}

async function subirMedia(file, clave){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_PRESET);
  try{
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/auto/upload`, { method:'POST', body: formData });
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data = await res.json();
    const tipo = data.resource_type === 'video' ? 'video' : 'image';
    const entry = { tipo, url: data.secure_url };
    if(tipo === 'video'){
      entry.thumbUrl = `https://res.cloudinary.com/${CLOUDINARY_CLOUD}/video/upload/so_0/${data.public_id}.jpg`;
    }
    mediaPorPlato[clave] = entry;
    scheduleSave();
    return true;
  }catch(e){
    console.warn("No se pudo subir a Cloudinary", e);
    alert('No se pudo subir la foto/vídeo. Comprueba tu conexión e inténtalo de nuevo.');
    return false;
  }
}

/* El botón refleja dos cosas distintas: cambios locales sin guardar (syncPending, #39) y una

function refreshBtnState(){
  const btn = document.getElementById('refreshBtn');
  const pending = syncPending || appVersionPending;
  btn.classList.toggle('pending', pending);
  btn.classList.toggle('done', !pending);
  btn.textContent = pending ? '🔄 Actualizar' : '✓ Actualizado';

/* Migra el formato antiguo de itemsSueltos (lista única global, sin fecha) al nuevo formato por
   día: los artículos ya guardados se asignan al día de hoy, la única fecha que tiene sentido
   suponer sin inventar una. */
function migrarItemsSueltos(raw){
  if(Array.isArray(raw)) return raw.length ? { [todayISOReal()]: raw } : {};
  return raw || {};
}
function todayISOReal(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}

    console.warn("No se pudo guardar en JSONBin", e);
    // syncPending sigue en true: hay cambios locales sin confirmar en el servidor (sin conexión,
    // o error puntual) y el botón de Actualizar se queda en rojo para poder reintentar a mano.
    setSync('err', 'Guardado solo en local');
  }
}

/* Fuerza el guardado inmediato saltándose el debounce de 700ms: se usa al ocultar la app (para no
   perder un cambio hecho justo antes de cambiar de pestaña) y al pulsar "Actualizar" a mano. */
function flushPendingSave(){
  if(!syncPending) return Promise.resolve();
  clearTimeout(saveTimer);
  return saveRemote();
}

/* Repasa JSONBin por si el otro móvil ha cambiado algo, sin que nadie tenga que pulsar nada.
   Se salta si hay cambios locales sin confirmar todavía, para no perderlos por una recarga. */
function autoPullIfIdle(){
  if(syncPending) return;
  loadRemote();
}

/* Comprueba si el código publicado en GitHub Pages es distinto al que tenemos cargado (el acceso
   directo de iPhone cachea muy agresivo y si no, nadie se entera de que hay una versión nueva).
   Si detecta un cambio, guarda cualquier pendiente y recarga sola — no hace falta tocar nada. */
async function checkAppVersion(){
  try{
    const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
    if(!res.ok) return;
    const html = await res.text();
    const m = html.match(/const APP_VERSION\s*=\s*"([^"]+)"/);
    if(m && m[1] !== APP_VERSION){
      appVersionPending = true;
      refreshBtnState();
      await flushPendingSave();
      location.href = location.pathname + '?v=' + Date.now();
    }
  }catch(e){
    // sin conexión: no se puede comprobar ahora, se reintenta en el próximo chequeo periódico
  }
}

/* Fusiona NUTRI (datos de partida, del PDF) con las ediciones a mano guardadas en nutriEdits
   (sincronizadas vía JSONBin) — así cualquiera puede corregir una fecha sin tocar el código. */
function efectivoNutri(id){
  return Object.assign({}, NUTRI[id], nutriEdits[id]);
}

const NOMBRES_DIA_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];

/* El principio y fin de cada plan se definían antes cargando el PDF correspondiente; ahora se
   editan desde "Yo" (finPlanActual). Si alguien amplía su fecha de fin más allá de su último día
   de menú real, aquí se completa el hueco repitiendo en bucle su propia rotación de comidas ya
   conocida — así ampliar la fecha amplía también el menú, sin depender de cargar un plan nuevo.
   Idempotente: solo añade lo que falta, nunca pisa un día real ya existente. Se llama al principio
   de render(), así se reaplica cada vez que cambian nutriEdits (carga de JSONBin, o al guardar). */
function extenderMenusSegunPlan(){
  let tocado = false;
  Object.keys(PERSONAS).forEach(id=>{
    const diasPersona = WEEK.filter(d=>d[id]).sort((a,b)=>a.date.localeCompare(b.date));
    if(!diasPersona.length) return;
    const nutri = efectivoNutri(id);
    const finPlan = nutri.finPlanActual;
    if(!finPlan) return;
    // Solo se repite el plan VIGENTE: si `inicioNuevoPlan` es posterior al primer día real, los
    // días de antes pertenecen a un plan ya superado y no deben entrar en lo que se repite (bug
    // reportado: se estaba repitiendo un plan antiguo en vez del vigente).
    const primerDiaReal = diasPersona[0].date;
    const inicioRotacionFecha = (nutri.inicioNuevoPlan && nutri.inicioNuevoPlan.slice(0,10) > primerDiaReal)
      ? nutri.inicioNuevoPlan.slice(0,10)
      : primerDiaReal;
    const diasRotacion = diasPersona.filter(d=>d.date >= inicioRotacionFecha);
    const rotacion = diasRotacion.map(d=>d[id]);
    const inicio = new Date(inicioRotacionFecha+"T00:00:00");
    const ultimoReal = new Date(diasPersona[diasPersona.length-1].date+"T00:00:00");
    const fin = new Date(finPlan.slice(0,10)+"T00:00:00");
    if(fin <= ultimoReal) return;
    for(const t = new Date(ultimoReal); t <= fin; t.setDate(t.getDate()+1)){
      if(t.getTime() === ultimoReal.getTime()) continue;
      const fechaISO = t.getFullYear() + "-" + String(t.getMonth()+1).padStart(2,'0') + "-" + String(t.getDate()).padStart(2,'0');
      let diaWeek = WEEK.find(d=>d.date===fechaISO);
      if(!diaWeek){
        diaWeek = { name: NOMBRES_DIA_SEMANA[t.getDay()], date: fechaISO };
        WEEK.push(diaWeek);
        tocado = true;
      }
      if(!diaWeek[id]){
        const diasDesdeInicio = Math.round((t - inicio) / 86400000);
        const indice = ((diasDesdeInicio % rotacion.length) + rotacion.length) % rotacion.length;
        diaWeek[id] = rotacion[indice];
        tocado = true;
      }
    }
  });
  if(tocado) WEEK.sort((a,b)=>a.date.localeCompare(b.date));
}

/* Copia texto al portapapeles para el aviso de WhatsApp (issue aviso-whatsapp). navigator.clipboard
   necesita contexto seguro (https, lo cumple GitHub Pages) y un gesto directo del usuario — lo es,
   se llama desde el propio click — pero por si el navegador/WebView no lo soporta, hay un segundo
   intento con el truco clásico de textarea oculto + execCommand. */
async function copiarAlPortapapeles(texto){
  try{
    await navigator.clipboard.writeText(texto);
    return true;
  }catch(e){
    try{
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e2){
      return false;
    }
  }
}

/* combina ingredientes de comida+cena de ambos, marcando la(s) fuente(s) */
/* separa un ingrediente en {nombre, cantidad}: "140 g de pollo" -> {nombre:"pollo", cantidad:"140 g"};
   "pollo" (sin cantidad reconocida) -> {nombre:"pollo", cantidad:null}. El nombre es la clave de
   fusión: dos apariciones con el mismo nombre son el mismo ingrediente aunque una lleve cantidad. */
function normalizarIngrediente(item){
  const m = item.match(/^((?:\d+\/\d+|\d+(?:[.,]\d+)?(?:-\d+(?:[.,]\d+)?)?|½|¼|⅓|⅔|¾)(?:\s*(?:g|kg|ml|l|c\/s|c\/c|ud\.?|unidades?)\b)?)\s*(?:de\s+)?(.+)$/i);
  if(!m) return {nombre:item.trim(), cantidad:null};
  return {nombre:m[2].trim(), cantidad:m[1].trim()};
}

const ICONOS_INGREDIENTE = [
  [/pollo|pavo|carrillada|morcillo|jamón|ternera|hígado|caña/i, "🍗"],
  [/pescado|bacalao|salmón|atún|merluza|rape|lenguado|dorada|corvina|caballa|gallineta|mejillon|almeja|gamba|sepia/i, "🐟"],
  [/huevo/i, "🥚"],
  [/queso|yogur|leche|kéfir/i, "🧀"],
  [/arroz|pasta|quinoa|pan\b/i, "🌾"],
  [/aceite|vinagre|sal\b|perejil|especias|ajo/i, "🫒"],
  [/zanahoria|puerro|calabaz|brócoli|espinaca|tomate|pimiento|cebolla|patata|boniato|champiñ|aceituna|calabacín|calabacin|verdura/i, "🥕"],
  [/almendra|nuez|nueces|semilla|frutos secos/i, "🥜"],
  [/manzana|pera|plátano|fruta|kiwi|naranja/i, "🍎"]
];
function iconoIngrediente(nombre){
  const hit = ICONOS_INGREDIENTE.find(([re]) => re.test(nombre));
  return hit ? hit[1] : "🛒";
}

/* Índice de la opción de desayuno/almuerzo/merienda elegida por `who` ese `date` para `cat`, o
   undefined si no ha elegido ninguna. */
function opcionElegidaIdx(date, who, cat){
  return opcionElegida[date] && opcionElegida[date][who] ? opcionElegida[date][who][cat] : undefined;
}

/* Elegir una tarjeta la marca para ese día/persona/categoría; volver a pulsar la misma la
   deselecciona (solo puede haber una elegida a la vez por categoría). */
function elegirOpcion(date, who, cat, i){
  opcionElegida[date] = opcionElegida[date] || {};
  opcionElegida[date][who] = opcionElegida[date][who] || {};
  if(opcionElegida[date][who][cat] === i) delete opcionElegida[date][who][cat];
  else opcionElegida[date][who][cat] = i;
  scheduleSave();
}

/* Recorre los ingredientes de comida/cena y de las opciones elegidas (issue #51) de un día, para
   las personas visibles, y llama a `add(item, who)` por cada uno. Común a la vista de un solo día
   (fridgeItems) y al agrupado semanal (agruparIngredientesSemana). */
function recolectarIngredientesDia(day, add){
  Object.keys(PERSONAS).filter(id=>day[id] && personasVisibles.has(id)).forEach(who=>{
    const person = day[who];
    ["comida","cena"].forEach(meal=>{
      const m = person[meal];
      const ing = (m.recipe && resolverReceta(m.recipe, modoReceta).version.ing) || m.ing;
      ing.forEach(item=>add(item, who));
    });
    const opcionesPersona = OPCIONES[who];
    if(opcionesPersona){
      Object.keys(opcionesPersona).forEach(cat=>{
        const i = opcionElegidaIdx(day.date, who, cat);
        const elegida = i!==undefined && opcionesPersona[cat][i];
        if(elegida && elegida.ing) elegida.ing.forEach(item=>add(item, who));
      });
    }
  });
}

function fridgeItems(day){
  const map = new Map(); // nombre normalizado -> {cantidades:Set, who:Set}
  recolectarIngredientesDia(day, (item, who) => {
    const {nombre, cantidad} = normalizarIngrediente(item);
    if(!map.has(nombre)) map.set(nombre, {cantidades:new Set(), who:new Set()});
    const entry = map.get(nombre);
    if(cantidad) entry.cantidades.add(cantidad);
    entry.who.add(who);
  });
  return Array.from(map.entries())
    .map(([nombre, {cantidades, who}])=>{
      const cant = cantidades.size ? ` (${Array.from(cantidades).join(" + ")})` : "";
      const label = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      return { item: label + cant, key: nombre, icono: iconoIngrediente(nombre), who: Array.from(who) };
    })
    .sort((a,b)=>a.item.localeCompare(b.item, "es"));
}

/* Interpreta la `cantidad` ya extraída por normalizarIngrediente (ej. "300 g", "2", "½", "1/3 c/s")
   para poder sumarla de verdad: peso a gramos, volumen a mililitros, cucharadas por su tipo, y
   cantidades sueltas (número o fracción sin unidad, o "ud"/"unidades") como unidades contables. Los
   rangos ("300-400") no se pueden sumar de forma fiable y se devuelven como null (se muestran
   aparte en vez de forzar una suma incorrecta). */
const FRACCIONES_TEXTO = { '½':0.5, '¼':0.25, '⅓':1/3, '⅔':2/3, '¾':0.75 };
function parseCantidad(cantidad){
  if(!cantidad || cantidad.includes('-')) return null;
  const m = cantidad.match(/^(\d+\/\d+|\d+(?:[.,]\d+)?|½|¼|⅓|⅔|¾)\s*(g|kg|ml|l|c\/s|c\/c|ud\.?|unidades?)?$/i);
  if(!m) return null;
  let valor;
  if(FRACCIONES_TEXTO[m[1]] !== undefined) valor = FRACCIONES_TEXTO[m[1]];
  else if(m[1].includes('/')){ const [n,d] = m[1].split('/').map(Number); valor = n/d; }
  else valor = parseFloat(m[1].replace(',','.'));
  const unidad = (m[2]||'').toLowerCase().replace(/\.$/,'');
  if(unidad === 'kg') return { tipo:'peso', valor: valor*1000 };
  if(unidad === 'g') return { tipo:'peso', valor };
  if(unidad === 'l') return { tipo:'volumen', valor: valor*1000 };
  if(unidad === 'ml') return { tipo:'volumen', valor };
  if(unidad === 'c/s') return { tipo:'cs', valor };
  if(unidad === 'c/c') return { tipo:'cc', valor };
  return { tipo:'unidad', valor };
}

/* Redondea a 2 decimales y usa coma decimal; si es entero, sin decimales. */
function formatNumero(n){
  const r = Math.round(n*100)/100;
  return Number.isInteger(r) ? String(r) : String(r).replace('.', ',');
}
function formatPeso(g){ return g >= 1000 ? formatNumero(g/1000)+' kg' : formatNumero(g)+' g'; }
function formatVolumen(ml){ return ml >= 1000 ? formatNumero(ml/1000)+' l' : formatNumero(ml)+' ml'; }

/* Agrupa de verdad (sumando, no solo listando) los ingredientes de varios días — para la compra
   semanal (issue #54). A diferencia de fridgeItems, que solo deduplica un único día, aquí un mismo
   ingrediente en varios días se convierte en una sola cantidad total. */
function agruparIngredientesSemana(dates){
  const map = new Map(); // nombre -> {peso,volumen,cs,cc,unidad, ocurrencias, extras:Set, who:Set}
  const vacio = () => ({ peso:0, volumen:0, cs:0, cc:0, unidad:0, ocurrencias:0, extras:new Set(), who:new Set() });
  const add = (item, who) => {
    const {nombre, cantidad} = normalizarIngrediente(item);
    if(!map.has(nombre)) map.set(nombre, vacio());
    const entry = map.get(nombre);
    entry.who.add(who);
    entry.ocurrencias++;
    if(!cantidad) return;
    const parsed = parseCantidad(cantidad);
    if(!parsed){ entry.extras.add(cantidad); return; }
    entry[parsed.tipo] += parsed.valor;
  };
  dates.forEach(date=>{
    const day = WEEK.find(d=>d.date===date);
    if(day) recolectarIngredientesDia(day, add);
  });
  return Array.from(map.entries())
    .map(([nombre, e])=>{
      const partes = [];
      if(e.peso) partes.push(formatPeso(e.peso));
      if(e.volumen) partes.push(formatVolumen(e.volumen));
      if(e.unidad) partes.push(formatNumero(e.unidad));
      if(e.cs) partes.push(formatNumero(e.cs)+' c/s');
      if(e.cc) partes.push(formatNumero(e.cc)+' c/c');
      e.extras.forEach(x=>partes.push(x));
      const label = nombre.charAt(0).toUpperCase() + nombre.slice(1);
      const texto = partes.length
        ? `${label} (${partes.join(' + ')})`
        : (e.ocurrencias > 1 ? `${label} × ${e.ocurrencias}` : label);
      return { item: texto, key: nombre, icono: iconoIngrediente(nombre), who: Array.from(e.who) };
    })
    .sort((a,b)=>a.item.localeCompare(b.item, "es"));
}

/* Botón para pasar de la vista diaria del menú al calendario de notas y viceversa (issue
   calendario-notas). Vive dentro de la pestaña "Menú" del nav — no es una pestaña nueva — y
   recuerda cuál fue la última elegida para arrancar ahí la próxima vez. */
function vistaMenuToggleHtml(){
  return `<div class="vista-menu-toggle receta-toggle" role="radiogroup">
    <button type="button" class="receta-opt ${vistaMenu==='dia'?'on':''}" data-vista-menu="dia" role="radio" aria-checked="${vistaMenu==='dia'}">🍽️ Menú semanal</button>
    <button type="button" class="receta-opt ${vistaMenu==='calendario'?'on':''}" data-vista-menu="calendario" role="radio" aria-checked="${vistaMenu==='calendario'}">📅 Calendario</button>
  </div>`;
}
function wireVistaMenuToggle(el){
  el.querySelectorAll('.vista-menu-toggle [data-vista-menu]').forEach(btn=>{
    btn.addEventListener('click', ()=> cambiarVistaMenu(btn.dataset.vistaMenu));
  });
}
function actualizarVisibilidadMenu(){
  const activo = currentTab === 'menu';
  document.getElementById('viewMenu').style.display = (activo && vistaMenu==='dia') ? '' : 'none';
  document.getElementById('viewCalendario').style.display = (activo && vistaMenu==='calendario') ? '' : 'none';
}
function cambiarVistaMenu(v){
  if(v === vistaMenu) return;
  guardarVistaMenu(v);
  actualizarVisibilidadMenu();
  if(vistaMenu === 'calendario') renderCalendario(); else renderMenu();

function renderMenu(){
  const day = WEEK[currentDay];
  const el = document.getElementById('viewMenu');
  const meal = (m,label) => {
    const clave = normalizarClave(m.title);
    const claveAttr = encodeURIComponent(clave);
    const media = mediaPorPlato[clave];
    const mediaHtml = media
      ? `<div class="meal-media" data-clave="${claveAttr}">
          <img alt="" loading="lazy">
          ${media.tipo==='video' ? `<button type="button" class="video-badge">▶</button>` : ''}
          <button type="button" class="media-edit-btn" data-clave="${claveAttr}" title="Cambiar foto/vídeo">✏️</button>
          <button type="button" class="media-del-btn" data-clave="${claveAttr}" title="Quitar foto/vídeo">🗑</button>
        </div>`
      : (m.img
          ? `<img class="meal-thumb" src="${m.img}" alt="" loading="lazy">`
          : `<button type="button" class="media-add-btn" data-clave="${claveAttr}" title="Añadir foto o vídeo">📷</button>`);
    return `
    <div class="meal">
      <div class="meal-label">${label}</div>
      <div class="meal-body">
        ${mediaHtml}
        <div class="meal-title">${m.title}</div>
      </div>
      ${m.recipe ? (()=>{
        const r = resolverReceta(m.recipe, modoReceta);
        const ing = r.version.ing || m.ing;
        return `
      <details class="recipe">
        <summary class="recipe-btn">Receta</summary>
        <div class="recipe-body">
          <div class="recipe-meta">
            <span class="recipe-servings">${m.recipe.servings}</span>
            <span class="recipe-mode">${MODOS_RECETA[r.mode]}</span>
          </div>
          <div class="recipe-subtitle">Ingredientes</div>
          <ul class="recipe-ing">${ing.map(i=>`<li>${i}</li>`).join('')}</ul>
          <div class="recipe-subtitle">Preparación</div>
          <ol class="recipe-steps">${r.version.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
        </div>
      </details>`;
      })() : ''}
    </div>`;
  };
  const CATS = {desayuno:'Desayuno', almuerzo:'Almuerzo', merienda:'Merienda'};
  const opcionCard = (opcion,who,cat,i,elegida) => {
    const clave = normalizarClave(opcion.texto);
    const claveAttr = encodeURIComponent(clave);
    const media = mediaPorPlato[clave];
    const claseElegida = elegida ? ' elegida' : '';
    if(media){
      return `<div class="opcion-card con-media${claseElegida}" data-who="${who}" data-cat="${cat}" data-i="${i}" data-clave="${claveAttr}">
        <div class="opcion-media-img">
          ${media.tipo==='video' ? `<button type="button" class="video-badge">▶</button>` : ''}
          <button type="button" class="media-edit-btn" data-clave="${claveAttr}" title="Cambiar foto/vídeo">✏️</button>
          <button type="button" class="media-del-btn" data-clave="${claveAttr}" title="Quitar foto/vídeo">🗑</button>
        </div>
        <div class="opcion-texto">${opcion.texto}</div>
      </div>`;
    }
    return `<div class="opcion-card${claseElegida}" data-who="${who}" data-cat="${cat}" data-i="${i}">
      <button type="button" class="media-add-btn opcion-media-add" data-clave="${claveAttr}" title="Añadir foto o vídeo">📷 Foto</button>
      ${opcion.texto}
    </div>`;
  };
  const opciones = (who) => {
    const o = OPCIONES[who];
    if(!o) return '';
    return Object.keys(CATS).filter(cat=>o[cat] && o[cat].length).map(cat => {
      const elegidaIdx = opcionElegidaIdx(day.date, who, cat);
      const elegida = elegidaIdx!=null ? o[cat][elegidaIdx] : null;
      const abierto = opcionesAbiertas.has(`${who}_${cat}`);
      return `
      <div class="opciones-block">
        <button type="button" class="opciones-toggle" data-who="${who}" data-cat="${cat}" aria-expanded="${abierto}">
          <span class="meal-label">${CATS[cat]}</span>
          ${elegida ? `<span class="opciones-preview">${elegida.texto}</span>` : ''}
          <span class="opciones-chevron">⌄</span>
        </button>
        <div class="opciones-collapse${abierto?' abierto':''}">
          <div class="opciones-collapse-inner">
            <div class="opciones-cards">
              ${o[cat].map((opcion,i)=>opcionCard(opcion,who,cat,i,i===elegidaIdx)).join('')}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  };
  const block = (who) => `
    <div class="card">
      <div class="person"><span class="dot ${who}"></span>${PERSONAS[who].nombre}</div>
      ${meal(day[who].comida,'Comida')}
      ${meal(day[who].cena,'Cena')}
      ${opciones(who)}
    </div>`;
  const visibles = Object.keys(PERSONAS).filter(id=>day[id] && personasVisibles.has(id));
  el.innerHTML = vistaMenuToggleHtml() + (visibles.length
    ? visibles.map(block).join('')
    : `<div class="empty">Ninguna persona seleccionada arriba 👆</div>`);
  wireVistaMenuToggle(el);

  el.querySelectorAll('.opcion-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.media-add-btn,.media-edit-btn,.media-del-btn,.video-badge')) return;
      if(e.target.closest('.opcion-media-img')){
        const media = mediaPorPlato[decodeURIComponent(card.dataset.clave || '')];
        if(media && media.tipo !== 'video'){ abrirImagenModal(cloudinaryOptim(media.url, 1200)); return; }
      }
      const {who, cat, i} = card.dataset;
      elegirOpcion(day.date, who, cat, Number(i));
      renderMenu();
      renderNevera();
      renderCompra();
    });
  });

  el.querySelectorAll('.opciones-toggle').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const { who, cat } = btn.dataset;
      const key = `${who}_${cat}`;
      const abierto = opcionesAbiertas.has(key);
      if(abierto) opcionesAbiertas.delete(key); else opcionesAbiertas.add(key);
      btn.setAttribute('aria-expanded', String(!abierto));
      btn.nextElementSibling.classList.toggle('abierto', !abierto);
    });
  });

  el.querySelectorAll('.meal-media[data-clave]').forEach(div=>{
    const media = mediaPorPlato[decodeURIComponent(div.dataset.clave)];
    if(!media) return;
    const src = media.tipo==='video' ? media.thumbUrl : media.url;
    div.querySelector('img').src = cloudinaryOptim(src, 120);
  });
  el.querySelectorAll('.opcion-card.con-media[data-clave]').forEach(card=>{
    const media = mediaPorPlato[decodeURIComponent(card.dataset.clave)];
    if(!media) return;
    const src = media.tipo==='video' ? media.thumbUrl : media.url;
    const imgDiv = card.querySelector('.opcion-media-img');
    imgDiv.style.backgroundImage = `url(${JSON.stringify(cloudinaryOptim(src, 640))})`;
  });
}

document.getElementById('viewMenu').addEventListener('click', (e)=>{
  const addBtn = e.target.closest('.media-add-btn,.media-edit-btn');
  if(addBtn){ e.stopPropagation(); abrirSelectorMedia(decodeURIComponent(addBtn.dataset.clave)); return; }
  const delBtn = e.target.closest('.media-del-btn');
  if(delBtn){
    e.stopPropagation();
    const clave = decodeURIComponent(delBtn.dataset.clave);
    if(confirm('¿Quitar la foto/vídeo de este plato?')){
      delete mediaPorPlato[clave];
      scheduleSave();
      renderMenu();
    }
    return;
  }
  const videoBtn = e.target.closest('.video-badge');
  if(videoBtn){
    e.stopPropagation();
    const contenedor = videoBtn.closest('[data-clave]');
    const media = contenedor && mediaPorPlato[decodeURIComponent(contenedor.dataset.clave)];
    if(media) abrirVideoModal(media.url);
    return;
  }
  const mediaDiv = e.target.closest('.meal-media[data-clave]');
  if(mediaDiv){
    const media = mediaPorPlato[decodeURIComponent(mediaDiv.dataset.clave)];
    if(media && media.tipo !== 'video') abrirImagenModal(cloudinaryOptim(media.url, 1200));
    return;
  }
  const thumb = e.target.closest('.meal-thumb');
  if(thumb){ abrirImagenModal(thumb.src); return; }
});

/* ---------- CALENDARIO Y NOTAS ----------
   Vive dentro de la pestaña "Menú" (ver vistaMenuToggleHtml más arriba), con sus propias vistas
   Día/Semana/Mes. Día y Semana siguen al mismo currentDay/WEEK que la vista diaria normal (el
   selector de días de arriba también los mueve); Mes navega con sus propias flechas, independiente
   de WEEK, porque se puede querer anotar una fecha sin menú real todavía (p.ej. el mes que viene). */

function formatoFechaLarga(iso){
  const d = new Date(iso+"T00:00:00");
  return `${NOMBRES_DIA_SEMANA[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;
}

/* Dicta por voz dentro del textarea más cercano (Web Speech API). Si el navegador no lo soporta
   (Safari/iOS es irregular según versión), se avisa y se puede escribir a mano igualmente. */
function dictarEnTextarea(btn){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const textarea = btn.closest('.cal-composer-row').querySelector('.cal-nota-input');
  if(!SpeechRec){ alert('Este navegador no permite dictar por voz aquí. Escribe la nota a mano.'); return; }
  const rec = new SpeechRec();
  rec.lang = 'es-ES';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  const iconoOriginal = btn.textContent;
  btn.textContent = '🔴';
  btn.disabled = true;
  rec.onresult = (e) => {
    const texto = e.results[0][0].transcript;
    textarea.value = (textarea.value ? textarea.value.trim() + ' ' : '') + texto;
  };
  rec.onerror = () => { alert('No se ha podido dictar. Inténtalo de nuevo o escribe la nota.'); };
  rec.onend = () => { btn.textContent = iconoOriginal; btn.disabled = false; };
  rec.start();
}

/* Wiring compartido por Día/Semana/Mes(modal): puede haber varios compositores/listas de notas a
   la vez en el mismo contenedor (Semana tiene 7), cada uno sabe su fecha por data-fecha. */
function wireNotasCalendario(container){
  container.querySelectorAll('.cal-sticker-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      btn.parentElement.querySelectorAll('.cal-sticker-opt').forEach(b=>b.classList.toggle('on', b===btn));
    });
  });
  container.querySelectorAll('.cal-dictar-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> dictarEnTextarea(btn));
  });
  container.querySelectorAll('.cal-guardar-nota').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const form = btn.closest('.cal-composer-form');
      const iso = form.dataset.fecha;
      const textarea = form.querySelector('.cal-nota-input');
      const texto = (textarea.value || '').trim();
      if(!texto) return;
      const tipoBtn = form.querySelector('.cal-sticker-opt.on');
      const tipo = tipoBtn ? tipoBtn.dataset.tipo : 'otro';
      if(!notasCalendario[iso]) notasCalendario[iso] = [];
      const id = Date.now()+'_'+Math.random().toString(36).slice(2,8);
      notasCalendario[iso].push({ id, autor: miUsuario, texto, tipo, creada: new Date().toISOString() });
      scheduleSave();
      if(btn.closest('#diaModal')) abrirDiaModal(iso); else renderCalendario();
      // Solo la nota recién creada "aparece" con gesto de chincheta — las demás no se vuelven a
      // animar en cada render, sería ruido (ver nota de diseño junto al CSS de .cal-nota).
      const marcar = () => document.querySelector(`.cal-nota[data-nota-id="${id}"]`)?.classList.add('nota-nueva');
      requestAnimationFrame(marcar);
    });
  });
  container.querySelectorAll('.cal-nota-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('¿Borrar esta nota?')) return;
      const iso = btn.dataset.notaFecha;
      const id = btn.dataset.notaId;
      notasCalendario[iso] = (notasCalendario[iso]||[]).filter(n=>n.id!==id);
      if(!notasCalendario[iso].length) delete notasCalendario[iso];
      scheduleSave();
      if(btn.closest('#diaModal')) abrirDiaModal(iso); else renderCalendario();
    });
  });
}

function renderDiaCalendarioHtml(iso){
  return `<div class="cal-dia-card cal-dia-card-solo">${diaDetalleHtml(iso)}</div>`;
}

function renderSemanaHtml(){
  const weekStart = Math.floor(currentDay/7)*7;
  const diasSemana = WEEK.slice(weekStart, weekStart+7);
  if(!diasSemana.length) return `<div class="empty">No hay días disponibles.</div>`;
  return `<div class="cal-semana">${diasSemana.map(d=>`<div class="cal-dia-card">${diaDetalleHtml(d.date)}</div>`).join('')}</div>`;
}

function renderMesHtml(){
  const {y,m} = mesCalendario;
  const primerDiaMes = new Date(y, m, 1);
  const diasEnMes = new Date(y, m+1, 0).getDate();
  const offsetLunes = (primerDiaMes.getDay() + 6) % 7; // getDay(): 0=domingo -> queremos lunes primero
  const celdas = [];
  for(let i=0;i<offsetLunes;i++) celdas.push(null);
  for(let d=1; d<=diasEnMes; d++) celdas.push(d);
  while(celdas.length % 7 !== 0) celdas.push(null);

  const visibles = Object.keys(PERSONAS).filter(id=>personasVisibles.has(id));
  const hoy = todayISOReal();
  const celdaHtml = (dia) => {
    if(dia===null) return `<div class="mes-celda mes-celda-vacia"></div>`;
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const diaWeek = WEEK.find(d=>d.date===iso);
    const personasConMenu = diaWeek ? visibles.filter(id=>diaWeek[id]) : [];
    const notas = notasDelDia(iso);
    const stickersUnicos = [...new Set(notas.map(n=>(TIPOS_NOTA[n.tipo]||TIPOS_NOTA.otro).icono))].slice(0,3);
    return `<button type="button" class="mes-celda${iso===hoy?' mes-celda-hoy':''}" data-fecha="${iso}">
      <span class="mes-celda-num">${dia}</span>
      <span class="mes-celda-chips">${personasConMenu.map(id=>`<span class="mes-chip ${id}" title="${PERSONAS[id].nombre}">${PERSONAS[id].nombre.slice(0,2)}</span>`).join('')}</span>
      ${stickersUnicos.length ? `<span class="mes-celda-stickers">${stickersUnicos.join('')}</span>` : ''}
    </button>`;
  };
  const nombreMes = MESES[m].charAt(0).toUpperCase() + MESES[m].slice(1);
  return `
    <div class="mes-cabecera">
      <button type="button" class="mes-nav" data-mes-offset="-1" aria-label="Mes anterior">‹</button>
      <div class="mes-titulo">${nombreMes} ${y}</div>
      <button type="button" class="mes-nav" data-mes-offset="1" aria-label="Mes siguiente">›</button>
    </div>
    <div class="mes-dias-semana">${['L','M','X','J','V','S','D'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="mes-grid">${celdas.map(celdaHtml).join('')}</div>`;
}

function renderCalendario(){
  const el = document.getElementById('viewCalendario');
  const fechaActual = WEEK[currentDay] ? WEEK[currentDay].date : todayISOReal();
  const NOMBRES_VISTA = { dia:'Día', semana:'Semana', mes:'Mes' };
  const calToggleHtml = `<div class="cal-vista-toggle receta-toggle" role="radiogroup">
    ${['dia','semana','mes'].map(v=>`<button type="button" class="receta-opt ${vistaCalendario===v?'on':''}" data-vista-cal="${v}" role="radio" aria-checked="${vistaCalendario===v}">${NOMBRES_VISTA[v]}</button>`).join('')}
  </div>`;
  let contenido;
  if(vistaCalendario === 'mes') contenido = renderMesHtml();
  else if(vistaCalendario === 'semana') contenido = renderSemanaHtml();
  else contenido = renderDiaCalendarioHtml(fechaActual);

  el.innerHTML = vistaMenuToggleHtml() + calToggleHtml + `<div class="cal-contenido cal-vista-${vistaCalendario}">${contenido}</div>`;
  wireVistaMenuToggle(el);
  el.querySelectorAll('.cal-vista-toggle [data-vista-cal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ guardarVistaCalendario(btn.dataset.vistaCal); renderCalendario(); });
  });
  el.querySelectorAll('.mes-nav').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const offset = Number(btn.dataset.mesOffset);
      let {y,m} = mesCalendario;
      m += offset;
      if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
      mesCalendario = {y,m};
      renderCalendario();
    });
  });
  el.querySelectorAll('.mes-celda[data-fecha]').forEach(btn=>{
    btn.addEventListener('click', ()=> abrirDiaModal(btn.dataset.fecha));
  });
  wireNotasCalendario(el);
}

function renderPersonPicker(){

  el.innerHTML = Object.keys(PERSONAS).map(id => `
    <button class="personchip ${id} ${personasVisibles.has(id)?'on':''}" data-id="${id}">${PERSONAS[id].nombre}</button>

/* Panel para elegir qué días entran en la compra semanal: los checkboxes de la semana visible, o
   un rango personalizado. Vive solo en Nevera → Semanal (issue #58); Compra → Semanal solo lee el
   resultado (comprasSemanaDias) y enlaza aquí para editarlo. */
function selectorDiasHtml(){

  const semanaDias = WEEK.slice(weekBlockStart, weekBlockStart+7);
  return `<div class="section-title">Días para la compra semanal</div>` +
    `<div class="receta-toggle dias-modo-toggle" role="radiogroup">
      <button type="button" class="receta-opt ${modoSeleccionDias==='semana'?'on':''}" data-modo-dias="semana" role="radio" aria-checked="${modoSeleccionDias==='semana'}">Esta semana</button>
      <button type="button" class="receta-opt ${modoSeleccionDias==='personalizado'?'on':''}" data-modo-dias="personalizado" role="radio" aria-checked="${modoSeleccionDias==='personalizado'}">Personalizado</button>

    `<div class="compra-semana-info">${comprasSemanaDias.size
      ? `${comprasSemanaDias.size} día${comprasSemanaDias.size===1?'':'s'} elegido${comprasSemanaDias.size===1?'':'s'}`
      : 'Elige los días que quieras agrupar.'}</div>`;
}
function wireSelectorDias(el){
  el.querySelectorAll('.dias-modo-toggle [data-modo-dias]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      modoSeleccionDias = btn.dataset.modoDias;
      guardarModoSeleccionDias();
      renderNevera();
      renderCompra();
    });
  });
  el.querySelectorAll('.compra-semana-dia input').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const fecha = cb.dataset.fecha;
      if(cb.checked) comprasSemanaDias.add(fecha); else comprasSemanaDias.delete(fecha);
      guardarComprasSemanaDias();
      renderNevera();
      renderCompra();
    });
  });
  const inicioInput = el.querySelector('#rangoInicio');
  const finInput = el.querySelector('#rangoFin');
  if(inicioInput) inicioInput.addEventListener('change', ()=>{

    aplicarRangoPersonalizado();
    renderNevera();
    renderCompra();

    renderNevera();
    renderCompra();
  });
}

/* Lista agrupada de la compra semanal — se usa tanto en Nevera → Semanal ('nevera': marca "ya lo
   tengo", con checksSemanal, nunca oculta nada) como en Compra → Semanal ('compra': oculta lo que
   ya está en la nevera según checksSemanal, y su propio checkbox marca "lo he comprado" con
   compradoSemanal, que solo tacha, igual que ya pasa en la Compra del día — issue #44/#70). */
function checklistSemanalHtml(modo){
  const dates = Array.from(comprasSemanaDias).sort();
  if(!dates.length) return `<div class="empty">Elige los días para ver aquí la compra agrupada.</div>`;
  const diasInfo = dates.map(f=>WEEK.find(d=>d.date===f)).filter(Boolean);
  const todos = agruparIngredientesSemana(dates);
  const esCompra = modo === 'compra';
  const items = esCompra ? todos.filter(({key})=>!checksSemanal[key]) : todos;
  return `<div class="compra-semana-resumen">${diasInfo.map(d=>`<span class="compra-semana-chip">${d.name.slice(0,3)} ${fmtDate(d.date)}</span>`).join('')}</div>` +
    `<div class="section-title">Compra agrupada</div>` +
    (items.length===0
      ? `<div class="empty">${esCompra && todos.length ? 'Ya tienes todo lo necesario en la nevera 🎉' : 'No hay ingredientes en los días elegidos'}</div>`
      : `<div class="card">${items.map(({item,key,icono})=>{
          const tachado = esCompra ? !!compradoSemanal[key] : !!checksSemanal[key];
          return `<div class="ing-row ${tachado?'checked':''}">
            <input type="checkbox" class="checksemanal-check" data-key="${encodeURIComponent(key)}" data-modo="${modo||'nevera'}" ${tachado?'checked':''}>
            <span style="width:20px;text-align:center">${icono}</span>
            <label>${item}</label>
          </div>`;
        }).join('')}</div>`);
}
function wireChecklistSemanal(el){
  el.querySelectorAll('.checksemanal-check').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const key = decodeURIComponent(cb.dataset.key);
      if(cb.dataset.modo === 'compra'){
        compradoSemanal[key] = cb.checked;
        cb.closest('.ing-row').classList.toggle('checked', cb.checked);
      } else {
        checksSemanal[key] = cb.checked;
        cb.closest('.ing-row').classList.toggle('checked', cb.checked);
        renderCompra();
      }
      scheduleSave();
    });
  });
}

function renderCompra(){
  const el = document.getElementById('viewCompra');
  const toggleHtml = vistaToggleHtml();

  if(compraVista === 'semanal'){
    el.innerHTML = toggleHtml +
      `<div class="compra-semana-editar"><button type="button" id="irANeveraDias">✏️ Editar días en Nevera</button></div>` +

  const day = WEEK[currentDay];
  const todosHoy = fridgeItems(day);
